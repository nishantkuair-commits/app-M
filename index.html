<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>M — Your voice, your space</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --bg: #ffffff; --border: #f1f5f9; --border-dark: #e2e8f0; --text-main: #0f172a;
      --text-muted: #64748b; --accent-lime: #bef264; --accent-lime-hover: #a3e635;
      --dark-btn: #18181b; --x-blue: #1d9bf0; --x-green: #00ba7c; --x-pink: #f91880;
      --card-hover: #fafafa; --widget-bg: #f8fafc;
    }
    
    /* DARK MODE COLORS */
    body.dark-mode {
      --bg: #000000; --border: #2f3336; --border-dark: #38444d; --text-main: #e7e9ea;
      --text-muted: #71767b; --dark-btn: #eff3f4; --card-hover: #16181c; --widget-bg: #16181c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; overflow-y: scroll; transition: background 0.2s, color 0.2s; }
    .app-container { display: flex; width: 100%; max-width: 1260px; min-height: 100vh; }
    
    /* LEFT RAIL */
    .left-rail { width: 84px; padding: 24px 14px; display: flex; flex-direction: column; align-items: center; gap: 18px; border-right: 1px solid var(--border); position: sticky; top: 0; height: 100vh; }
    .brand-logo { width: 48px; height: 48px; background: var(--text-main); color: var(--bg); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; cursor: pointer; }
    .nav-btn { width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: var(--text-muted); border: none; background: transparent; cursor: pointer; transition: 0.2s; }
    .nav-btn:hover, .nav-btn.active { background: var(--border); color: var(--text-main); }
    .nav-btn svg { width: 22px; height: 22px; stroke-width: 2.2; }
    .post-fab { margin-top: auto; width: 48px; height: 48px; border-radius: 16px; background: var(--accent-lime); border: none; cursor: pointer; font-size: 26px; font-weight: 700; box-shadow: 0 4px 12px rgba(190, 242, 100, 0.35); }
    
    /* CENTER FEED */
    .center-col { flex: 1; max-width: 660px; border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 100vh; }
    .feed-header { padding: 20px 24px 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    .feed-header h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
    .feed-header p { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
    
    .tabs-bar { display: flex; border-bottom: 1px solid var(--border); padding: 0 16px; gap: 32px; }
    .tab-btn { background: none; border: none; padding: 14px 6px; font-size: 14px; font-weight: 600; color: var(--text-muted); cursor: pointer; position: relative; }
    .tab-btn.active { color: var(--text-main); font-weight: 700; }
    .tab-btn.active::after { content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 3px; background: #84cc16; border-radius: 4px 4px 0 0; }
    
    /* COMPOSER */
    .composer-box { padding: 18px 24px; border-bottom: 1px solid var(--border); display: flex; gap: 16px; }
    .user-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--border); color: var(--text-muted); font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; overflow: hidden; cursor: pointer; }
    .composer-main { flex: 1; }
    .composer-main textarea { width: 100%; border: none; outline: none; resize: none; font-family: inherit; font-size: 16px; color: var(--text-main); background: transparent; min-height: 60px; }
    
    .media-preview-container { margin-top: 8px; display: none; position: relative; border-radius: 14px; overflow: hidden; max-height: 240px; }
    .media-preview-container img { width: 100%; height: auto; object-fit: cover; display: block; }
    .media-preview-remove { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.6); color: #fff; border: none; border-radius: 50%; width: 26px; height: 26px; cursor: pointer; }
    
    .composer-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }
    .tool-icon-btn { background: none; border: none; color: var(--x-blue); cursor: pointer; padding: 6px; border-radius: 8px; transition: 0.15s; }
    .tool-icon-btn:hover { background: rgba(29,155,240,0.1); }
    .post-submit-btn { background: var(--accent-lime); border: none; font-weight: 700; padding: 9px 20px; border-radius: 12px; cursor: pointer; color: #1a2e05; }
    
    /* POST CARD */
    .feed-list { display: flex; flex-direction: column; padding-bottom: 40px; }
    .post-card { padding: 18px 24px; border-bottom: 1px solid var(--border); display: flex; gap: 16px; transition: 0.15s; }
    .post-card:hover { background: var(--card-hover); }
    .post-body { flex: 1; min-width: 0; }
    .post-author-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; cursor: pointer; }
    .author-name { font-weight: 700; font-size: 15px; }
    .author-handle, .post-time { font-size: 13px; color: var(--text-muted); }
    .post-time { margin-left: auto; }
    .post-text { font-size: 15px; line-height: 1.5; word-break: break-word; }
    .post-image-box { margin-top: 10px; border-radius: 14px; overflow: hidden; border: 1px solid var(--border); max-height: 400px; }
    .post-image-box img { width: 100%; height: auto; display: block; object-fit: cover; }
    
    .post-interactions { display: flex; justify-content: space-between; max-width: 440px; margin-top: 12px; }
    .action-icon-btn { background: none; border: none; font-size: 13px; font-weight: 600; color: var(--text-muted); display: flex; align-items: center; gap: 6px; cursor: pointer; padding: 4px 6px; border-radius: 8px; }
    .action-icon-btn:hover { color: var(--x-blue); background: rgba(29,155,240,0.08); }
    .action-icon-btn.liked { color: var(--x-pink); }
    
    .comments-section { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border); display: none; }
    .comment-input-box { display: flex; gap: 10px; margin-bottom: 16px; }
    .comment-input-box input { flex: 1; padding: 8px 12px; border: 1px solid var(--border-dark); background: transparent; color: var(--text-main); border-radius: 99px; outline: none; font-size: 13px; }
    .comment-input-box button { background: var(--text-main); color: var(--bg); border: none; padding: 0 14px; border-radius: 99px; font-weight: 600; cursor: pointer; font-size: 12px; }
    .comment-item { display: flex; gap: 10px; margin-bottom: 12px; font-size: 13px; }
    
    /* RIGHT SIDEBAR */
    .right-col { width: 350px; padding: 24px 20px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
    .search-box { background: var(--widget-bg); border: 1px solid var(--border-dark); border-radius: 99px; padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
    .search-box input { background: none; border: none; outline: none; width: 100%; font-size: 14px; color: var(--text-main); }
    .widget-card { background: var(--widget-bg); border: 1px solid var(--border); border-radius: 20px; padding: 20px; }
    .dark-cta-btn { width: 100%; background: var(--text-main); color: var(--bg); border: none; padding: 11px; border-radius: 99px; font-weight: 700; cursor: pointer; display: flex; justify-content: center; }
    
    /* NOTIFICATIONS */
    .notif-item { padding: 14px 24px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; align-items: center; }
    
    /* TOAST & MODAL */
    .toast-box { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--text-main); color: var(--bg); padding: 10px 20px; border-radius: 99px; font-size: 13.5px; font-weight: 600; display: none; z-index: 1000; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 999; }
    .modal-content { background: var(--bg); border: 1px solid var(--border); border-radius: 24px; width: 90%; max-width: 400px; padding: 26px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12.5px; font-weight: 700; margin-bottom: 4px; color: var(--text-muted); }
    .form-group input { width: 100%; padding: 11px 14px; border: 1px solid var(--border-dark); background: transparent; color: var(--text-main); border-radius: 12px; outline: none; font-size: 14px; }
    
    /* PROFILE VIEW */
    .profile-cover { height: 160px; background: #cbd5e1; position: relative; }
    .profile-info { padding: 16px 24px; }
    .profile-info-top { display: flex; justify-content: space-between; align-items: flex-end; margin-top: -60px; }
    .prof-big-avatar { width: 90px; height: 90px; border-radius: 50%; border: 4px solid var(--bg); background: var(--border); display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 800; color: var(--text-muted); position: relative; z-index: 2; overflow: hidden; }
    
    @media (max-width: 960px) { .right-col { display: none; } .center-col { max-width: 100%; border-right: none; } }
  </style>
</head>
<body id="appBody">

<div class="app-container">
  <!-- LEFT RAIL -->
  <aside class="left-rail">
    <div class="brand-logo" onclick="switchTab('foryou')">M</div>
    <button class="nav-btn active" id="btnNavHome" onclick="switchTab('foryou')">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
    </button>
    <button class="nav-btn" id="btnNavProfile" onclick="openMyProfile()">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
    </button>
    <button class="nav-btn" id="btnNavNotif" onclick="switchTab('notifications')">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
    </button>
    <button class="nav-btn" id="btnNavBookmarks" onclick="switchTab('bookmarks')">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/></svg>
    </button>
    
    <!-- DARK MODE TOGGLE BUTTON (NEW) -->
    <button class="nav-btn" onclick="toggleDarkMode()" title="Toggle Dark/Light Mode">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
    </button>

    <button class="post-fab" onclick="document.getElementById('postInput')?.focus()">+</button>
  </aside>

  <!-- CENTER MAIN FEED -->
  <main class="center-col">
    <div class="feed-header" id="mainHeader">
      <div><h1 id="feedHeaderTitle">Home</h1><p id="feedHeaderSub">A little space for what matters.</p></div>
      <button id="installAppBtn" style="display:none; background:var(--text-main); color:var(--bg); border:none; padding:8px 16px; border-radius:99px; font-weight:700; cursor:pointer; font-size:13px;">Install ⬇️</button>
    </div>

    <div class="tabs-bar" id="mainTabs">
      <button class="tab-btn active" id="tabForYou" onclick="switchTab('foryou')">For you ✨</button>
      <button class="tab-btn" id="tabFollowing" onclick="switchTab('following')">Following</button>
    </div>

    <div class="composer-box" id="composerBox">
      <div class="user-avatar" id="composerAvatar" onclick="openMyProfile()">M</div>
      <div class="composer-main">
        <textarea id="postInput" maxlength="280" placeholder="What's happening?"></textarea>
        <input type="file" id="mediaUpload" accept="image/*,video/*" style="display:none" onchange="handleFileUpload(event)">
        <div class="media-preview-container" id="mediaPreviewContainer">
          <img id="mediaPreviewImg" src="" alt="preview"><button class="media-preview-remove" onclick="removeMedia()">✕</button>
        </div>
        <div class="composer-footer">
          <div class="composer-tools-left">
            <button class="tool-icon-btn" onclick="document.getElementById('mediaUpload').click()"><svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg></button>
          </div>
          <button class="post-submit-btn" onclick="submitPost()">Post ↗</button>
        </div>
      </div>
    </div>

    <div id="profileView" style="display:none;">
      <div class="profile-cover" id="profCover"></div>
      <div class="profile-info">
        <div class="profile-info-top">
          <div class="prof-big-avatar" id="profBigAvatar"></div>
          <button class="dark-cta-btn" id="editProfBtn" style="width:auto; padding:8px 18px; font-size:14px; display:none;" onclick="openEditProfileModal()">Edit profile</button>
        </div>
        <div style="margin-top:10px;">
          <h2 style="font-size:22px; font-weight:800;" id="profNameTitle">Name</h2>
          <p style="color:var(--text-muted); font-size:14px;" id="profHandleText">@handle</p>
        </div>
        <p style="margin-top:12px; font-size:15px;" id="profBioText">Bio here</p>
      </div>
      <div class="tabs-bar"><button class="tab-btn active">Posts</button></div>
    </div>

    <div class="feed-list" id="feedContainer">
      <div style="padding: 40px; text-align: center; color: #94a3b8; font-weight: 600;">Loading...</div>
    </div>
  </main>

  <!-- RIGHT RAIL -->
  <aside class="right-col">
    <div class="search-box">
      <svg width="18" height="18" fill="none" stroke="#94a3b8" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Search M" oninput="handleSearch()">
    </div>
    <div class="widget-card" id="authWidget">
      <div class="widget-title">Join M today.</div>
      <button class="dark-cta-btn" onclick="openAuthModal('signup')">Create account</button>
    </div>
  </aside>
</div>

<div class="toast-box" id="toast">Alert</div>

<div class="modal-overlay" id="authModal">
  <div class="modal-content">
    <div class="modal-title" id="authModalTitle">Welcome to M</div>
    <div class="form-group" id="usernameGroup">
      <label>Username</label><input type="text" id="authUsername" placeholder="e.g. nishant_01">
    </div>
    <div class="form-group">
      <label>Email</label><input type="email" id="authEmail" placeholder="you@example.com">
    </div>
    <div class="form-group">
      <label>Password</label><input type="password" id="authPassword" placeholder="••••••••">
    </div>
    <div style="display:flex; gap:10px; margin-top:18px;">
      <button class="dark-cta-btn" onclick="handleAuthSubmit()">Continue</button>
      <button class="dark-cta-btn" style="background:var(--border); color:var(--text-main);" onclick="closeModal('authModal')">Cancel</button>
    </div>
    <div style="text-align: center; margin-top: 14px;"><a style="font-size: 13px; font-weight: 600; color: var(--text-muted); cursor: pointer;" onclick="toggleAuthMode()">Switch login mode</a></div>
  </div>
</div>

<div class="modal-overlay" id="editProfileModal">
  <div class="modal-content">
    <div class="modal-title">Edit profile</div>
    <div class="form-group">
      <label>Bio</label>
      <input type="text" id="editBioInput" placeholder="A little about yourself...">
    </div>
    <div class="form-group">
      <label>Profile Photo (DP)</label>
      <input type="file" id="editAvatarUpload" accept="image/*" style="font-size:13px;">
    </div>
    <div style="display:flex; gap:10px; margin-top:18px;">
      <button class="dark-cta-btn" onclick="saveProfile()">Save Profile</button>
      <button class="dark-cta-btn" style="background:var(--border); color:var(--text-main);" onclick="closeModal('editProfileModal')">Cancel</button>
    </div>
  </div>
</div>

<script>
  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
  
  // DARK MODE INITIALIZER FROM LOCALSTORAGE
  if (localStorage.getItem('m_theme') === 'dark') {
    document.getElementById('appBody').classList.add('dark-mode');
  }
  function toggleDarkMode() {
    const body = document.getElementById('appBody');
    body.classList.toggle('dark-mode');
    if (body.classList.contains('dark-mode')) {
      localStorage.setItem('m_theme', 'dark');
      showToast('Dark Mode Enabled 🌙');
    } else {
      localStorage.setItem('m_theme', 'light');
      showToast('Light Mode Enabled ☀️');
    }
  }

  let deferredPrompt; const installBtn = document.getElementById('installAppBtn');
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; installBtn.style.display = 'block'; });
  installBtn.addEventListener('click', async () => { if (deferredPrompt) { deferredPrompt.prompt(); await deferredPrompt.userChoice; installBtn.style.display = 'none'; deferredPrompt = null; }});

  const SUPABASE_URL = "https://obhzdfmbpgjfqgjdovng.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9iaHpkZm1icGdqZnFnamRvdm5nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1OTI0NDQsImV4cCI6MjEwNzE2ODQ0NH0.GgyFMuDWVll124VONThOC9znxcTE_QzraDdaDck7yug";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUser = null;
  let allPosts = [];
  let profilesMap = {};
  let currentTab = 'foryou'; 
  let viewingProfileId = null;
  let uploadedImageUrl = '';
  let bookmarks = JSON.parse(localStorage.getItem('m_bookmarks') || '[]');
  let reposts = JSON.parse(localStorage.getItem('m_reposts') || '[]');

  const blueTickSVG = `<svg style="color:var(--x-blue); width:18px; height:18px; margin-left:4px; vertical-align:text-bottom;" fill="currentColor" viewBox="0 0 24 24"><path d="M22.5 12.5l-2.03 2.37.4 3.1-3.07.72-1.74 2.58-2.95-1.28-2.95 1.28-1.74-2.58-3.07-.72.4-3.1L3.5 12.5l2.03-2.37-.4-3.1 3.07-.72 1.74-2.58 2.95 1.28 2.95-1.28 1.74 2.58 3.07.72-.4 3.1 2.03 2.37z"/></svg>`;

  async function init() {
    try {
      const { data: { session } } = await sb.auth.getSession();
      currentUser = session ? session.user : null;
    } catch (e) {}
    updateAuthUI();
    loadFeed();
  }

  function showToast(msg) { const t = document.getElementById('toast'); t.innerText = msg; t.style.display = 'block'; setTimeout(() => { t.style.display = 'none'; }, 2500); }
  function closeModal(id) { document.getElementById(id).style.display = 'none'; }

  function updateAuthUI() {
    const avatar = document.getElementById('composerAvatar');
    const widget = document.getElementById('authWidget');
    if (currentUser) {
      const name = currentUser.user_metadata?.username || currentUser.email.split('@')[0];
      const myProf = profilesMap[currentUser.id];
      avatar.innerHTML = myProf && myProf.avatar_url ? `<img src="${myProf.avatar_url}" style="width:100%; height:100%; object-fit:cover;">` : name.charAt(0).toUpperCase();
      widget.innerHTML = `<div class="widget-title">Hi, @${name}!</div><button class="dark-cta-btn" onclick="handleLogout()">Log out</button>`;
    } else {
      avatar.innerHTML = "M";
    }
  }

  async function loadFeed() {
    if (currentTab === 'notifications') return loadNotifications();
    try {
      const { data: profs } = await sb.from('profiles').select('*');
      if (profs) { profs.forEach(p => profilesMap[p.id] = p); updateAuthUI(); }

      let { data: posts, error } = await sb.from('posts').select('*, likes(*), comments(*)').order('created_at', { ascending: false });
      if (error) throw error;
      allPosts = posts || [];
      
      if (currentTab === 'profile') renderProfileView();
      else renderFeed(allPosts);
    } catch (err) { document.getElementById('feedContainer').innerHTML = `<div style="padding:40px; text-align:center;">Error: ${err.message}</div>`; }
  }

  function generatePostsHtml(postsArr) {
    if (postsArr.length === 0) return `<div style="padding: 40px; text-align: center; color: var(--text-muted);">No posts found!</div>`;
    
    return postsArr.map(p => {
      const isMine = currentUser && currentUser.id === p.user_id;
      const isLiked = currentUser && p.likes && p.likes.some(l => l.user_id === currentUser.id);
      const isBookmarked = bookmarks.includes(String(p.id));
      const commentsCount = p.comments ? p.comments.length : 0;
      
      const prof = profilesMap[p.user_id] || {};
      const avatarHtml = prof.avatar_url ? `<img src="${prof.avatar_url}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">` : (p.username||'?').charAt(0).toUpperCase();
      const verifiedHtml = prof.is_verified ? blueTickSVG : '';

      let contentText = p.content || '';
      let finalContent = escapeHtml(contentText);
      let imgHtml = '';
      const imgMatch = contentText.match(/(https?:\/\/[^\s]+?\.(?:png|jpg|jpeg|gif|webp))/i);
      if (imgMatch) {
         finalContent = finalContent.replace(imgMatch[0], '').trim();
         imgHtml = `<div class="post-image-box"><img src="${imgMatch[0]}" loading="lazy"></div>`;
      }

      let commentsHtml = (p.comments || []).map(c => `
        <div class="comment-item">
          <div class="user-avatar" style="width:24px;height:24px;font-size:10px;">${(c.username||'?').charAt(0).toUpperCase()}</div>
          <div><strong style="color:var(--text-main);">@${c.username || 'user'}</strong> ${escapeHtml(c.content)}</div>
        </div>
      `).join('');

      return `
        <div class="post-card" id="post-${p.id}">
          <div class="user-avatar" onclick="openProfile('${p.user_id}')">${avatarHtml}</div>
          <div class="post-body">
            <div class="post-author-row" onclick="openProfile('${p.user_id}')">
              <span class="author-name">${p.username || 'user'} ${verifiedHtml}</span>
              <span class="author-handle">@${p.username || 'user'}</span>
            </div>
            <div class="post-text">${finalContent}</div>
            ${imgHtml}
            <div class="post-interactions">
              <button class="action-icon-btn" onclick="toggleComments('comment-sec-${p.id}')">💬 <span>${commentsCount}</span></button>
              <button class="action-icon-btn" onclick="toggleRepost('${p.id}')">🔁 <span>${reposts.includes(String(p.id))?1:0}</span></button>
              <button class="action-icon-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike('${p.id}', ${isLiked}, '${p.user_id}')">${isLiked ? '❤️' : '🤍'} <span>${p.likes ? p.likes.length : 0}</span></button>
              <button class="action-icon-btn ${isBookmarked ? 'bookmarked' : ''}" onclick="toggleBookmark('${p.id}')">${isBookmarked ? '🔖' : '📑'}</button>
              ${isMine ? `<button class="action-icon-btn" style="color:#ef4444;" onclick="deletePost('${p.id}')">🗑️</button>` : ''}
            </div>
            <div class="comments-section" id="comment-sec-${p.id}">
              <div class="comment-input-box">
                <input type="text" id="reply-input-${p.id}" placeholder="Post your reply...">
                <button onclick="submitReply('${p.id}', '${p.user_id}')">Reply</button>
              </div>
              ${commentsHtml}
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  function renderFeed(postsArr) {
    let filtered = [...postsArr];
    if (currentTab === 'bookmarks') filtered = filtered.filter(p => bookmarks.includes(String(p.id)));
    document.getElementById('feedContainer').innerHTML = generatePostsHtml(filtered);
  }

  function openMyProfile() { if (!currentUser) return openAuthModal(); openProfile(currentUser.id); }
  function openProfile(userId) { viewingProfileId = userId; switchTab('profile'); }

  function renderProfileView() {
    const prof = profilesMap[viewingProfileId] || { username: 'user', bio: 'Hey there! I am using M.', is_verified: false };
    if (!prof.username) { const p = allPosts.find(x => x.user_id === viewingProfileId); if(p) prof.username = p.username; }

    const avatarHtml = prof.avatar_url ? `<img src="${prof.avatar_url}" style="width:100%;height:100%;object-fit:cover;">` : (prof.username||'U').charAt(0).toUpperCase();
    
    document.getElementById('profBigAvatar').innerHTML = avatarHtml;
    document.getElementById('profNameTitle').innerHTML = `${prof.username || 'User'} ${prof.is_verified ? blueTickSVG : ''}`;
    document.getElementById('profHandleText').innerText = `@${prof.username || 'user'}`;
    document.getElementById('profBioText').innerText = prof.bio || 'Hey there! I am using M.';
    document.getElementById('editProfBtn').style.display = (currentUser && currentUser.id === viewingProfileId) ? 'block' : 'none';

    const userPosts = allPosts.filter(p => p.user_id === viewingProfileId);
    document.getElementById('feedContainer').innerHTML = generatePostsHtml(userPosts);
  }

  function openEditProfileModal() {
    const prof = profilesMap[currentUser.id] || {};
    document.getElementById('editBioInput').value = prof.bio || '';
    document.getElementById('editProfileModal').style.display = 'flex';
  }

  async function saveProfile() {
    if (!currentUser) return;
    showToast('Saving profile...');
    const bio = document.getElementById('editBioInput').value;
    const dpInput = document.getElementById('editAvatarUpload');
    let avatarUrl = profilesMap[currentUser.id]?.avatar_url || '';

    if (dpInput.files.length > 0) {
      const file = dpInput.files[0];
      const filePath = `dp_${currentUser.id}_${Math.random()}`;
      const { error: upErr } = await sb.storage.from('media').upload(filePath, file);
      if (!upErr) { avatarUrl = sb.storage.from('media').getPublicUrl(filePath).data.publicUrl; }
    }

    const username = currentUser.user_metadata?.username || currentUser.email.split('@')[0];
    await sb.from('profiles').upsert({ id: currentUser.id, username, bio, avatar_url: avatarUrl });
    closeModal('editProfileModal'); showToast('Profile updated! ✅'); loadFeed();
  }

  async function handleFileUpload(event) {
    if (!currentUser) return openAuthModal();
    const file = event.target.files[0]; if (!file) return;
    showToast('Uploading photo...');
    const filePath = `${currentUser.id}/${Math.random()}.${file.name.split('.').pop()}`;
    const { error: upErr } = await sb.storage.from('media').upload(filePath, file);
    if (upErr) return alert(upErr.message);
    uploadedImageUrl = sb.storage.from('media').getPublicUrl(filePath).data.publicUrl;
    document.getElementById('mediaPreviewImg').src = uploadedImageUrl;
    document.getElementById('mediaPreviewContainer').style.display = 'block';
    showToast('Upload Complete!');
  }
  function removeMedia() { uploadedImageUrl = ''; document.getElementById('mediaUpload').value = ''; document.getElementById('mediaPreviewContainer').style.display = 'none'; }

  async function submitPost() {
    if (!currentUser) return openAuthModal();
    let content = document.getElementById('postInput').value.trim();
    if (uploadedImageUrl) content += ' ' + uploadedImageUrl;
    if (!content) return;
    const username = currentUser.user_metadata?.username || currentUser.email.split('@')[0];
    await sb.from('posts').insert([{ user_id: currentUser.id, username, content }]);
    document.getElementById('postInput').value = ''; removeMedia(); showToast('Posted!'); loadFeed();
  }

  async function submitReply(postId, postOwnerId) {
    if (!currentUser) return openAuthModal();
    const input = document.getElementById(`reply-input-${postId}`); if (!input.value.trim()) return;
    const username = currentUser.user_metadata?.username || currentUser.email.split('@')[0];
    await sb.from('comments').insert([{ post_id: postId, user_id: currentUser.id, username, content: input.value.trim() }]);
    if (currentUser.id !== postOwnerId) await sb.from('notifications').insert([{ user_id: postOwnerId, actor_username: username, type: 'reply', post_id: postId }]);
    showToast('Reply added!'); loadFeed();
  }

  async function toggleLike(postId, isLiked, postOwnerId) {
    if (!currentUser) return openAuthModal();
    if (isLiked) await sb.from('likes').delete().match({ post_id: postId, user_id: currentUser.id });
    else {
      await sb.from('likes').insert([{ post_id: postId, user_id: currentUser.id }]);
      if (currentUser.id !== postOwnerId) await sb.from('notifications').insert([{ user_id: postOwnerId, actor_username: (currentUser.user_metadata?.username || 'User'), type: 'like', post_id: postId }]);
    }
    loadFeed();
  }
  function toggleComments(id) { const sec = document.getElementById(id); sec.style.display = sec.style.display === 'block' ? 'none' : 'block'; }

  async function loadNotifications() {
    if (!currentUser) return document.getElementById('feedContainer').innerHTML = `<div style="padding:40px;text-align:center;">Log in to see notifications</div>`;
    const { data } = await sb.from('notifications').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false });
    const feed = document.getElementById('feedContainer');
    if (!data || data.length === 0) return feed.innerHTML = `<div style="padding:40px;text-align:center;color:var(--text-muted);">No notifications yet 🔔</div>`;
    feed.innerHTML = data.map(n => `<div class="notif-item"><div style="font-size:24px;">${n.type === 'like' ? '❤️' : '💬'}</div><div><strong>@${n.actor_username || 'User'}</strong> ${n.type === 'like' ? 'liked your post' : 'replied to your post'}</div></div>`).join('');
  }

  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('composerBox').style.display = 'none';
    document.getElementById('mainTabs').style.display = 'none';
    document.getElementById('profileView').style.display = 'none';
    document.getElementById('mainHeader').style.display = 'flex';

    if (tab === 'foryou' || tab === 'following') {
      document.getElementById('composerBox').style.display = 'flex';
      document.getElementById('mainTabs').style.display = 'flex';
      document.getElementById('btnNavHome').classList.add('active');
      document.getElementById('feedHeaderTitle').innerText = 'Home';
      loadFeed();
    } else if (tab === 'bookmarks') {
      document.getElementById('btnNavBookmarks').classList.add('active');
      document.getElementById('feedHeaderTitle').innerText = 'Bookmarks';
      loadFeed();
    } else if (tab === 'notifications') {
      document.getElementById('btnNavNotif').classList.add('active');
      document.getElementById('feedHeaderTitle').innerText = 'Notifications';
      loadNotifications();
    } else if (tab === 'profile') {
      document.getElementById('btnNavProfile').classList.add('active');
      document.getElementById('mainHeader').style.display = 'none';
      document.getElementById('profileView').style.display = 'block';
      renderProfileView();
    }
  }

  function toggleRepost(postId) { if (reposts.includes(postId)) reposts = reposts.filter(id => id !== postId); else { reposts.push(postId); showToast('Reposted!'); } localStorage.setItem('m_reposts', JSON.stringify(reposts)); loadFeed(); }
  function toggleBookmark(postId) { if (bookmarks.includes(postId)) bookmarks = bookmarks.filter(id => id !== postId); else { bookmarks.push(postId); showToast('Saved 🔖'); } localStorage.setItem('m_bookmarks', JSON.stringify(bookmarks)); loadFeed(); }
  async function deletePost(postId) { if (!confirm('Delete post?')) return; await sb.from('posts').delete().eq('id', postId); loadFeed(); }
  function handleSearch() { const q = document.getElementById('searchInput').value.toLowerCase(); document.getElementById('feedContainer').innerHTML = generatePostsHtml(allPosts.filter(p => (p.content||'').toLowerCase().includes(q) || (p.username||'').toLowerCase().includes(q))); }
  function escapeHtml(str) { return (str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m]); }

  let isSignUpMode = true;
  function openAuthModal(mode = 'login') { isSignUpMode = (mode === 'signup'); document.getElementById('authModal').style.display = 'flex'; }
  function toggleAuthMode() { isSignUpMode = !isSignUpMode; }
  async function handleAuthSubmit() {
    const e = document.getElementById('authEmail').value.trim(), p = document.getElementById('authPassword').value.trim(), u = document.getElementById('authUsername').value.trim();
    let res = isSignUpMode ? await sb.auth.signUp({ email:e, password:p, options:{data:{username:u||e.split('@')[0]}} }) : await sb.auth.signInWithPassword({ email:e, password:p });
    if (res.error) alert(res.error.message); else { currentUser = res.data.user; closeModal('authModal'); updateAuthUI(); loadFeed(); }
  }
  async function handleLogout() { await sb.auth.signOut(); currentUser = null; updateAuthUI(); loadFeed(); }
  window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
