<head>
  <meta charset="UTF-8">

  <title>M — Your voice, your space</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    /* UI Colors */
    :root {
      --bg: #ffffff; --border: #f1f5f9; --border-dark: #e2e8f0; --text-main: #0f172a;
      --text-muted: #64748b; --accent-lime: #bef264; --x-blue: #1d9bf0; --x-pink: #f91880; --x-green: #00ba7c;
      --card-hover: #fafafa; --widget-bg: #f8fafc;
    }
    body.dark-mode {
      --bg: #000000; --border: #2f3336; --border-dark: #38444d; --text-main: #e7e9ea;
      --text-muted: #71767b; --card-hover: #16181c; --widget-bg: #16181c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; overflow-y: scroll; transition: background 0.2s, color 0.2s; }
    /* Keep the app visible even if initialization or a third-party script fails. */
    .app-container { visibility: visible; }
    .app-container { display: flex; width: 100%; max-width: 1260px; min-height: 100vh; }
    
    /* LEFT SIDEBAR */
    .left-rail { width: 84px; padding: 24px 14px; display: flex; flex-direction: column; align-items: center; gap: 18px; border-right: 1px solid var(--border); position: sticky; top: 0; height: 100vh; }
    .brand-logo { width: 48px; height: 48px; background: var(--text-main); color: var(--bg); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; cursor: pointer; position: relative; }
    .nav-btn { width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: var(--text-muted); border: none; background: transparent; cursor: pointer; transition: 0.2s; }
    .nav-btn:hover, .nav-btn.active { background: var(--border); color: var(--text-main); }
    .nav-btn svg { width: 24px; height: 24px; stroke-width: 2.2; }
    .post-fab { margin-top: auto; width: 48px; height: 48px; border-radius: 16px; background: var(--accent-lime); border: none; cursor: pointer; font-size: 26px; font-weight: 700; color: #1a2e05; }
    
    /* CENTER FEED */
    .center-col { flex: 1; max-width: 660px; border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 100vh; }
    .feed-header { padding: 20px 24px 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: rgba(255,255,255,0.8); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 10; }
    body.dark-mode .feed-header { background: rgba(0,0,0,0.8); }
    .feed-header h1 { font-size: 22px; font-weight: 800; }
    .header-title-row { display:flex; align-items:center; gap:12px; min-width:0; }
    .back-btn { width:40px; height:40px; flex:0 0 40px; border:1px solid var(--border-dark); border-radius:50%; background:var(--bg); color:var(--text-main); display:flex; align-items:center; justify-content:center; font-size:25px; line-height:1; cursor:pointer; }
    .back-btn:active { transform:scale(.96); }
    .feed-header p { font-size: 13px; color: var(--text-muted); }
    
    .tabs-bar { display: flex; border-bottom: 1px solid var(--border); padding: 0 16px; gap: 32px; }
    .tab-btn { background: none; border: none; padding: 14px 6px; font-size: 14px; font-weight: 600; color: var(--text-muted); cursor: pointer; position: relative; }
    .tab-btn.active { color: var(--text-main); font-weight: 700; }
    .tab-btn.active::after { content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 3px; background: #84cc16; border-radius: 4px 4px 0 0; }
    
    /* COMPOSER */
    .composer-box { padding: 18px 24px; border-bottom: 1px solid var(--border); display: flex; gap: 16px; }
    .user-avatar img { width:100%; height:100%; object-fit:cover; border-radius:50%; display:block; }
    .user-avatar { overflow:hidden; width: 44px; height: 44px; border-radius: 50%; background: var(--border); color: var(--text-muted); font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .composer-main { flex: 1; }
    .composer-main textarea { width: 100%; border: none; outline: none; resize: none; font-family: inherit; font-size: 18px; color: var(--text-main); background: transparent; min-height: 60px; margin-top: 8px; }
    
    .media-preview-container { margin-top: 8px; display: none; position: relative; border-radius: 14px; overflow: hidden; max-height: 240px; border: 1px solid var(--border); }
    .media-preview-container img { width: 100%; height: auto; object-fit: cover; }
    .media-preview-remove { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.7); color: #fff; border: none; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; }
    
    .composer-footer { display: flex; justify-content: space-between; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
    .tool-icon-btn { background: none; border: none; color: var(--x-blue); cursor: pointer; padding: 8px; border-radius: 50%; }
    .tool-icon-btn:hover { background: rgba(29,155,240,0.1); }
    .post-submit-btn { background: var(--accent-lime); border: none; font-weight: 700; padding: 10px 24px; border-radius: 99px; cursor: pointer; color: #1a2e05; font-size: 15px; }
    
    /* POST CARDS */
    .feed-list { display: flex; flex-direction: column; padding-bottom: 60px; }
    .post-card { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; gap: 16px; transition: 0.15s; }
    .post-card:hover { background: var(--card-hover); }
    .post-body { flex: 1; min-width: 0; }
    .post-author-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
    .author-name { font-weight: 700; font-size: 16px; }
    .author-handle { font-size: 14px; color: var(--text-muted); }
    .post-time-badge { font-size: 12px; color: var(--text-muted); margin-left: auto; }
    .post-text { font-size: 16px; line-height: 1.5; word-break: break-word; margin-bottom: 12px; }
    .post-image-box { border-radius: 16px; overflow: hidden; border: 1px solid var(--border); margin-bottom: 12px; }
    .post-image-box img { width: 100%; height: auto; display: block; object-fit: cover; }
    
    .post-interactions { display: flex; justify-content: space-between; max-width: 420px; }
    .action-icon-btn { background: none; border: none; font-size: 14px; font-weight: 600; color: var(--text-muted); display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 8px; border-radius: 50px; }
    .action-icon-btn:hover { color: var(--x-blue); background: rgba(29,155,240,0.1); }
    .action-icon-btn.liked { color: var(--x-pink); }
    .action-icon-btn.bookmarked { color: var(--x-green); }
    
    /* COMMENTS */
    .comments-section { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); display: none; }
    .comment-input-box { display: flex; gap: 12px; margin-bottom: 20px; }
    .comment-input-box input { flex: 1; padding: 10px 16px; border: 1px solid var(--border-dark); background: var(--bg); color: var(--text-main); border-radius: 99px; outline: none; }
    .comment-input-box button { background: var(--text-main); color: var(--bg); border: none; padding: 0 20px; border-radius: 99px; font-weight: 700; cursor: pointer; }
    .comment-item { display: flex; gap: 12px; margin-bottom: 16px; font-size: 14px; background: var(--widget-bg); padding: 12px; border-radius: 12px; }
    
    /* DMS & CHAT */
    .dm-user-item, .notif-item { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; cursor: pointer; }
    .dm-user-item:hover, .notif-item:hover { background: var(--card-hover); }
    .chat-box-container { display: flex; flex-direction: column; height: calc(100vh - 75px); }
    .chat-messages { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
    
    .chat-bubble { max-width: 75%; padding: 10px 16px; border-radius: 18px; font-size: 15px; line-height: 1.4; word-break: break-word; min-width: 80px; position: relative; cursor: pointer; user-select: none; }
    .chat-bubble.sent { background: var(--x-blue); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
    .chat-bubble.received { background: var(--border-dark); color: var(--text-main); align-self: flex-start; border-bottom-left-radius: 4px; }
    .chat-time { font-size: 10px; opacity: 0.7; margin-top: 4px; text-align: right; }
    .chat-input-row { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; gap: 12px; background: var(--bg); }
    .chat-input-row input { flex: 1; padding: 12px 20px; border: 1px solid var(--border-dark); background: transparent; color: var(--text-main); border-radius: 99px; outline: none; }
    .chat-input-row button { background: var(--x-blue); color: #fff; border: none; padding: 0 24px; border-radius: 99px; font-weight: 700; cursor: pointer; }

    /* RIGHT SIDEBAR */
    .right-col { width: 350px; padding: 24px 20px; display: flex; flex-direction: column; gap: 20px; position: sticky; top: 0; height: 100vh; }
    .search-box { background: var(--widget-bg); border: 1px solid var(--border-dark); border-radius: 99px; padding: 12px 20px; display: flex; align-items: center; gap: 12px; }
    .search-box input { background: none; border: none; outline: none; width: 100%; font-size: 15px; color: var(--text-main); }
    .widget-card { background: var(--widget-bg); border: 1px solid var(--border); border-radius: 24px; padding: 24px; }
    .dark-cta-btn { width: 100%; background: var(--text-main); color: var(--bg); border: none; padding: 12px; border-radius: 99px; font-weight: 700; font-size: 15px; cursor: pointer; }
    
    /* MODALS & TOAST */
    .toast-box { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--x-blue); color: #fff; padding: 12px 24px; border-radius: 99px; font-size: 14px; font-weight: 700; display: none; z-index: 1000; box-shadow: 0 10px 15px -3px rgba(29,155,240,0.3); }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 999; backdrop-filter: blur(4px); }
    .modal-content { background: var(--bg); border: 1px solid var(--border); border-radius: 24px; width: 90%; max-width: 420px; padding: 32px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; color: var(--text-muted); }
    .form-group input { width: 100%; padding: 12px 16px; border: 1px solid var(--border-dark); background: transparent; color: var(--text-main); border-radius: 12px; outline: none; font-size: 15px; }
    
    @media (max-width: 960px) { .right-col { display: none; } .center-col { max-width: 100%; border-right: none; } }

    /* M ULTRA PREMIUM SYSTEM — global polish, styling only */

    button,input,textarea { font:inherit; }

    ::selection { background:rgba(190,242,100,.28); color:#fff; }

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js'); });
  }

  // These three collections are loaded from Supabase for the signed-in user.
  // localStorage is intentionally NOT used for social relationships anymore.
  let bookmarks = [];
  let reposts = [];
  let following = [];
  let socialStateLoadedFor = null;
  let socialStateRequest = 0;
  
  if (localStorage.getItem('m_theme') === 'dark') { document.getElementById('appBody').classList.add('dark-mode'); }
  function toggleDarkMode() {
    const body = document.getElementById('appBody'); body.classList.toggle('dark-mode');
    localStorage.setItem('m_theme', body.classList.contains('dark-mode') ? 'dark' : 'light');
    showToast(body.classList.contains('dark-mode') ? 'Dark Mode 🌙' : 'Light Mode ☀️');
  }

  const SUPABASE_URL = "https://rirtxrppoaejswowfysi.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_luCCf87iAIKtr1gFDVFQzg_Sx6K6jZM";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUser = null;
  let allPosts = [];
  const profileCache = Object.create(null);
  let myProfile = null;
  let currentTab = 'foryou'; 
  let activeChatUser = null;
  let uploadedImageUrl = '';
  
  let realtimeNotificationsSubscription = null;
  let realtimeNotificationsUserId = null;
  let realtimeChatSubscription = null;
  let chatPollTimer = null;
  let currentMessageCount = 0;
  let feedRefreshTimer = null;
  
  async function init() {
    // Never let a failed network request or optional initialization step leave
    // the entire app hidden on a blank screen.
    const allowedTabs = ['foryou', 'following', 'bookmarks', 'notifications', 'messages'];
    let savedTab = 'foryou';
    try {
      const candidate = localStorage.getItem('m_last_tab');
      if (candidate && allowedTabs.includes(candidate)) savedTab = candidate;
    } catch (_) {}

    try {
      try {
        const { data: { session } } = await sb.auth.getSession();
        currentUser = session ? session.user : null;
      } catch (e) {
        console.error('M session initialization failed:', e);
      }

      try { updateAuthUI(); } catch (e) { console.error('M auth UI failed:', e); }
      try { await loadMyProfileRecord(); } catch (e) { console.warn('M profile load failed:', e); }
      try { await syncRealtimeNotifications(); } catch (e) { console.error('M notification realtime setup failed:', e); }
      try { await loadUserSocialState(); } catch (e) { console.error('M social state failed:', e); }
      try { switchTab(savedTab, true); } catch (e) {
        console.error('M tab initialization failed:', e);
        try { switchTab('foryou', true); } catch (_) {}
      }
      try { startFeedAutoRefresh(); } catch (e) { console.error('M auto refresh failed:', e); }
    } catch (e) {
      console.error('M app initialization failed:', e);
    } finally {
      document.body.classList.add('app-ready');
    }
  }

  function showToast(msg) { const t = document.getElementById('toast'); t.innerText = msg; t.style.display = 'block'; setTimeout(() => { t.style.display = 'none'; }, 2500); }
  function closeModal(id) { document.getElementById(id).style.display = 'none'; }

  function updateAuthUI() {
    const avatar = document.getElementById('composerAvatar');
    const widget = document.getElementById('authWidget');
    if (currentUser) {

    }

  async function loadUserSocialState() {
    const requestId = ++socialStateRequest;
    const userId = currentUser?.id || null;
    if (!userId) {
      bookmarks = []; reposts = []; following = [];
      socialStateLoadedFor = null;
      return;
    }
    // Avoid leaking one account's state into another account on a shared browser.
    bookmarks = []; reposts = []; following = [];
    try {
      const [b, r, f] = await Promise.all([
        sb.from('app_bookmarks').select('post_id').eq('user_id', userId),
        sb.from('app_reposts').select('post_id').eq('user_id', userId),
        sb.from('app_follows').select('following_id').eq('follower_id', userId)
      ]);
      if (requestId !== socialStateRequest || currentUser?.id !== userId) return;
      const failed = [b, r, f].find(x => x.error);
      if (failed) {
        console.error('Social state load failed:', failed.error);
        showToast('Social tables setup needed. See SQL setup.');
        socialStateLoadedFor = null;
        return;
      }
      bookmarks = (b.data || []).map(x => String(x.post_id));
      reposts = (r.data || []).map(x => String(x.post_id));
      following = (f.data || []).map(x => String(x.following_id));
      socialStateLoadedFor = userId;
    } catch (e) {
      console.error('Social state load failed:', e);
      showToast('Could not load saved social features.');
    }
  }

  function formatTime(dateString) {
    if (!dateString) return new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    const d = new Date(dateString);
    const today = new Date();
    if(d.toDateString() === today.toDateString()){
       return d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    } else {
       return d.toLocaleDateString([], {month: 'short', day: 'numeric'}) + ' ' + d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    }
  }

  async function loadFeed() {
    if (currentTab === 'notifications') return loadNotifications();
    if (currentTab === 'messages') return loadMessagesInbox();
    
    try {
      let { data: posts, error } = await sb.from('posts').select('*, likes(*), comments(*)').order('created_at', { ascending: false });
      if (!error) { allPosts = posts || []; await loadProfilesForPosts(allPosts); renderFeed(allPosts); }
    } catch (err) {}
  }

  function startFeedAutoRefresh() {
    if(feedRefreshTimer) clearInterval(feedRefreshTimer);
    feedRefreshTimer = setInterval(async () => {
      if (currentTab !== 'foryou' && currentTab !== 'following') return;
      // Do not redraw the feed while the user is typing a reply; that destroys the input.
      const active = document.activeElement;
      if (active && active.id && active.id.startsWith('reply-input-')) return;
      try {
        let { data: posts, error } = await sb.from('posts').select('*, likes(*), comments(*)').order('created_at', { ascending: false });
        if (!error && posts) {
          allPosts = posts;
          await loadProfilesForPosts(allPosts);
          renderFeed(allPosts);
        }
      } catch(e) { console.warn('Feed refresh failed:', e); }
    }, 5000);
  }

  function generatePostsHtml(postsArr) {
    if (postsArr.length === 0) return `<div style="padding: 40px; text-align: center; color: var(--text-muted); font-size:18px;">No posts found!</div>`;
    return postsArr.map(p => {
      const isMine = currentUser && currentUser.id === p.user_id;
      const isLiked = currentUser && p.likes && p.likes.some(l => l.user_id === currentUser.id);
      const isBookmarked = bookmarks.includes(String(p.id));
      const isFollowing = following.includes(p.user_id);
      const commentsCount = p.comments ? p.comments.length : 0;
      const authorProfile = profileCache[p.user_id] || {};
      const authorName = authorProfile.username || p.username || 'user';
      const avatarLetter = authorName.charAt(0).toUpperCase();
      const postAvatarUrl = authorProfile.avatar_url || ((currentUser && p.user_id === currentUser.id) ? (currentUser.user_metadata?.avatar_url || '') : '');
      const postTimeStr = formatTime(p.created_at);

      let contentText = p.content || ''; let finalContent = escapeHtml(contentText); let imgHtml = '';
      const mediaMatch = contentText.match(/https?:\/\/[^\s]+/i);
      if (mediaMatch && /\.(png|jpg|jpeg|gif|webp|mp4|webm|mov)(\?|$)/i.test(mediaMatch[0])) {
         const mediaUrl = mediaMatch[0];
         finalContent = finalContent.replace(mediaUrl, '').trim();
         if (/\.(mp4|webm|mov)(\?|$)/i.test(mediaUrl)) imgHtml = `<div class="post-image-box"><video src="${escapeHtml(mediaUrl)}" controls playsinline style="width:100%;display:block;"></video></div>`;
         else imgHtml = `<div class="post-image-box"><img src="${escapeHtml(mediaUrl)}" loading="lazy" alt="Post media"></div>`;
      }

      let commentsHtml = (p.comments || []).map(c => `
        <div class="comment-item">
          <div class="user-avatar" style="width:28px;height:28px;font-size:12px;border:none;">${escapeHtml((c.username||'?').charAt(0).toUpperCase())}</div>
          <div><strong style="color:var(--text-main);">@${escapeHtml(c.username || 'user')}</strong> <span style="margin-left:4px;">${escapeHtml(c.content)}</span></div>
        </div>
      `).join('');

      return `
        <div class="post-card" id="post-${p.id}">
          <div class="user-avatar" role="button" tabindex="0" title="View @${escapeHtml(authorName)} profile" style="cursor:pointer;" onclick="openPublicProfile('${p.user_id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openPublicProfile('${p.user_id}')}">${postAvatarUrl ? `<img src="${escapeHtml(postAvatarUrl)}" alt="Profile photo">` : escapeHtml(avatarLetter)}</div>
          <div class="post-body">
            <div class="post-author-row">
              <span class="author-name" role="button" tabindex="0" style="cursor:pointer;" onclick="openPublicProfile('${p.user_id}')" onkeydown="if(event.key==='Enter'){openPublicProfile('${p.user_id}')}">${escapeHtml(authorName)}</span> 
              <span class="author-handle" role="button" tabindex="0" style="cursor:pointer;" onclick="openPublicProfile('${p.user_id}')">@${escapeHtml(authorName)}</span>
              ${!isMine ? `<span style="color:var(--text-muted); margin:0 4px;">·</span> <button style="background:none; border:none; color:var(--x-blue); font-weight:700; font-size:14px; cursor:pointer;" onclick="toggleFollow('${p.user_id}')">${isFollowing ? 'Following' : 'Follow'}</button>` : ''}
              <span class="post-time-badge">${postTimeStr}</span>
            </div>
            <div class="post-text">${finalContent}</div>
            ${imgHtml}
            <div class="post-interactions">
              <button class="action-icon-btn" onclick="toggleComments('comment-sec-${p.id}')">💬 <span>${commentsCount}</span></button>
              <button class="action-icon-btn" onclick="toggleRepost('${p.id}')">🔁 <span>${reposts.includes(String(p.id))?1:0}</span></button>
              <button class="action-icon-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike('${p.id}', ${isLiked}, '${p.user_id}')">${isLiked ? '❤️' : '🤍'} <span>${p.likes ? p.likes.length : 0}</span></button>
              <button class="action-icon-btn ${isBookmarked ? 'bookmarked' : ''}" onclick="toggleBookmark('${p.id}')">${isBookmarked ? '🔖' : '📑'}</button>
              ${isMine ? `<button class="action-icon-btn" style="color:#ef4444;" onclick="deletePost('${p.id}')">🗑️</button>` : ''}
            </div>
            <div class="comments-section" id="comment-sec-${p.id}">
              <div class="comment-input-box">
                <input type="text" id="reply-input-${p.id}" placeholder="Post your reply...">
                <button onclick="submitReply('${p.id}', '${p.user_id}')">Reply</button>
              </div>
              ${commentsHtml}

          </div>

    }).join('');

  function renderFeed(postsArr) {
    // Preserve unsent reply drafts and cursor if another action refreshes the feed.
    const feedContainer = document.getElementById('feedContainer');
    const replyDrafts = {};
    feedContainer.querySelectorAll('input[id^="reply-input-"]').forEach(input => {
      replyDrafts[input.id] = { value: input.value, focused: document.activeElement === input,
        start: input.selectionStart, end: input.selectionEnd };
    });

    let filtered = [...postsArr];
    if (currentTab === 'bookmarks') {
        filtered = filtered.filter(p => bookmarks.includes(String(p.id)));
    } else if (currentTab === 'following') {
        filtered = filtered.filter(p => following.includes(p.user_id));
        if (filtered.length === 0) {
            feedContainer.innerHTML = `<div style="padding: 40px; text-align: center; color: var(--text-muted); font-size:18px;">You aren't following anyone yet!</div>`;
            return;
        }
    }
    feedContainer.innerHTML = generatePostsHtml(filtered);

    Object.entries(replyDrafts).forEach(([id, draft]) => {
      const input = document.getElementById(id);
      if (!input) return;
      input.value = draft.value;
      if (draft.focused) {
        input.focus({ preventScroll: true });
        try { input.setSelectionRange(draft.start, draft.end); } catch (_) {}
      }
    });
  }

  async function toggleBookmark(postId) {
    if (!currentUser) return openAuthModal('login');
    postId = String(postId);
    if (socialStateLoadedFor !== currentUser.id) await loadUserSocialState();
    const alreadySaved = bookmarks.includes(postId);
    try {
      const result = alreadySaved
        ? await sb.from('app_bookmarks').delete().eq('user_id', currentUser.id).eq('post_id', postId)
        : await sb.from('app_bookmarks').insert([{ user_id: currentUser.id, post_id: postId }]);
      if (result.error) { showToast('Bookmark failed: ' + result.error.message); return; }
      bookmarks = alreadySaved ? bookmarks.filter(id => id !== postId) : [...bookmarks, postId];
      showToast(alreadySaved ? 'Bookmark removed' : 'Post bookmarked 🔖');
      renderFeed(allPosts);
    } catch (e) { showToast('Bookmark failed. Please try again.'); }
  }

  async function toggleRepost(postId) {
    if (!currentUser) return openAuthModal('login');
    postId = String(postId);
    if (socialStateLoadedFor !== currentUser.id) await loadUserSocialState();
    const alreadyReposted = reposts.includes(postId);
    try {
      const result = alreadyReposted
        ? await sb.from('app_reposts').delete().eq('user_id', currentUser.id).eq('post_id', postId)
        : await sb.from('app_reposts').insert([{ user_id: currentUser.id, post_id: postId }]);
      if (result.error) { showToast('Repost failed: ' + result.error.message); return; }
      reposts = alreadyReposted ? reposts.filter(id => id !== postId) : [...reposts, postId];
      showToast(alreadyReposted ? 'Repost removed' : 'Reposted 🔁');
      renderFeed(allPosts);
    } catch (e) { showToast('Repost failed. Please try again.'); }
  }

  async function deletePost(postId) {
    if (!currentUser) return openAuthModal('login');
    const post = allPosts.find(p => String(p.id) === String(postId));
    if (!post || post.user_id !== currentUser.id) return showToast('You can only delete your own post.');
    if (!confirm('Are you sure you want to delete this post?')) return;
    const { data, error } = await sb.from('posts').delete()
      .eq('id', postId).eq('user_id', currentUser.id).select('id');
    if (error) { alert('Delete failed: ' + error.message); return; }
    if (!data || data.length === 0) { showToast('Post not deleted. Check Supabase DELETE policy.'); return; }
    allPosts = allPosts.filter(p => String(p.id) !== String(postId));
    bookmarks = bookmarks.filter(id => id !== String(postId));
    reposts = reposts.filter(id => id !== String(postId));
    // Clean up this user's saved rows; other users' rows may remain without FK cascade.
    await Promise.all([
      sb.from('app_bookmarks').delete().eq('post_id', String(postId)),
      sb.from('app_reposts').delete().eq('post_id', String(postId))
    ]);
    renderFeed(allPosts);
    showToast('Post deleted 🗑️');
  }

  async function toggleFollow(userId) {
    if (!currentUser) return openAuthModal('login');
    userId = String(userId);
    const username = profileDisplayName(userId, 'user');
    if (userId === currentUser.id) return showToast("You can't follow yourself.");
    if (socialStateLoadedFor !== currentUser.id) await loadUserSocialState();
    const alreadyFollowing = following.includes(userId);
    try {
      const result = alreadyFollowing
        ? await sb.from('app_follows').delete().eq('follower_id', currentUser.id).eq('following_id', userId)
        : await sb.from('app_follows').insert([{ follower_id: currentUser.id, following_id: userId }]);
      if (result.error) { showToast('Follow failed: ' + result.error.message); return; }
      following = alreadyFollowing ? following.filter(id => id !== userId) : [...following, userId];
      showToast(alreadyFollowing ? `Unfollowed @${username}` : `Following @${username} ✅`);
      renderFeed(allPosts);
    } catch (e) { showToast('Follow failed. Please try again.'); }
  }

  async function toggleLike(postId, isLiked, postOwnerId) {
    if (!currentUser) return openAuthModal('login');
    try {
      let result;
      if (isLiked) result = await sb.from('likes').delete().match({ post_id: postId, user_id: currentUser.id });
      else result = await sb.from('likes').insert([{ post_id: postId, user_id: currentUser.id }]);
      if (result.error) { showToast('Like error: ' + result.error.message); return; }
      await loadFeed();
      // The database trigger creates the notification for a successful like.
    } catch(e) { showToast('Like failed: ' + (e.message || 'Please try again')); }
  }

  function toggleComments(id) { const sec = document.getElementById(id); sec.style.display = sec.style.display === 'block' ? 'none' : 'block'; }

  async function submitReply(postId, postOwnerId) {
    if (!currentUser) { openAuthModal('login'); return; }
    const input = document.getElementById(`reply-input-${postId}`);
    if (!input) { showToast('Reply box not found. Please open comments again.'); return; }
    const replyText = input.value.trim();
    if (!replyText) { showToast('Pehle reply likho.'); input.focus(); return; }

    const username = currentUser.user_metadata?.username || currentUser.email?.split('@')[0] || 'User';
    const numericPostId = Number(postId);
    if (!Number.isFinite(numericPostId)) { showToast('Invalid post ID.'); return; }

    const replyButton = input.parentElement?.querySelector('button');
    if (replyButton) { replyButton.disabled = true; replyButton.textContent = 'Posting...'; }
    try {
      const { error } = await sb.from('comments').insert([{
        post_id: numericPostId,
        user_id: currentUser.id,
        username,
        content: replyText
      }]);
      if (error) {
        showToast('Reply failed: ' + error.message);
        console.error('Reply insert error:', error);
        return;
      }

      // The database trigger creates the reply notification after the comment is saved.

      showToast('Reply added!');
      await loadFeed();
    } catch (e) {
      showToast('Reply failed: ' + (e.message || 'Please try again'));
      console.error('Reply failed:', e);
    } finally {
      const btn = document.querySelector(`#comment-sec-${postId} .comment-input-box button`);
      if (btn) { btn.disabled = false; btn.textContent = 'Reply'; }
    }
  }

  async function syncRealtimeNotifications() {
    const userId = currentUser?.id || null;

    // Reuse the existing channel when the same account is still signed in.
    if (userId && realtimeNotificationsSubscription && realtimeNotificationsUserId === userId) return;

    if (realtimeNotificationsSubscription) {
      try { await sb.removeChannel(realtimeNotificationsSubscription); } catch (e) {
        console.warn('Could not remove old notification channel:', e);
      }
      realtimeNotificationsSubscription = null;
      realtimeNotificationsUserId = null;
    }

    if (!userId) return;

    realtimeNotificationsUserId = userId;
    realtimeNotificationsSubscription = sb
      .channel('m-notifications-' + userId)
      .on('postgres_changes', {
        event: 'INSERT',
        schema: 'public',
        table: 'notifications',
        filter: 'user_id=eq.' + userId
      }, (payload) => {
        // Ignore events for another account as an extra client-side safeguard.
        if (!currentUser || currentUser.id !== userId) return;
        const notification = payload?.new;
        if (!notification || notification.user_id !== userId) return;

        if (currentTab === 'notifications') {
          loadNotifications();
        } else {
          const type = String(notification.type || '').toLowerCase();
          const messages = {
            like: '❤️ Someone liked your post',
            reply: '💬 You got a new reply',
            comment: '💬 Someone commented on your post',
            follow: '👤 You have a new follower'
          };
          showToast(messages[type] || '🔔 New notification');
        }
      })
      .subscribe((status) => {
        if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
          console.warn('M notification realtime status:', status);
        }
      });
  }

  async function loadMessagesInbox() {
    if (!currentUser) return openAuthModal('login');
    const feed = document.getElementById('feedContainer');
    if (!feed) return;
    try {
      let uniqueUsers = [];
      const { data: publicProfiles, error: profilesError } = await sb.from('public_profiles')
        .select('user_id, username').neq('user_id', currentUser.id).order('username').limit(100);
      if (!profilesError && Array.isArray(publicProfiles)) {
        uniqueUsers = publicProfiles
          .filter(profile => profile.user_id && profile.user_id !== currentUser.id)
          .map(profile => ({ id: String(profile.user_id), username: String(profile.username || 'user') }));
      } else {
        console.warn('Could not load chat users from profiles; falling back to feed users:', profilesError);
        const seen = new Set();
        (allPosts || []).forEach(post => {
          const id = String(post.user_id || '');
          if (id && id !== currentUser.id && !seen.has(id)) {
            seen.add(id);
            uniqueUsers.push({ id, username: String(post.username || 'user') });
          }
        });
      }
      if (uniqueUsers.length === 0) {
        feed.innerHTML = `<div style="padding:40px;text-align:center;color:var(--text-muted);">No other users found yet!</div>`;
        return;
      }
      feed.innerHTML = `
        <div style="padding:16px 24px;font-weight:800;border-bottom:1px solid var(--border);color:var(--text-main);font-size:18px;">Start a Chat</div>
        <div>${uniqueUsers.map(u => {
          const name = escapeHtml(u.username);
          return `<div class="dm-user-item" role="button" tabindex="0" data-user-id="${escapeHtml(u.id)}" data-username="${name}">
            <div class="user-avatar">${escapeHtml((u.username || 'U').charAt(0).toUpperCase())}</div>
            <div><div style="font-weight:800;font-size:16px;">@${name}</div><div style="font-size:14px;color:var(--text-muted);">Tap here to send a message</div></div>
          </div>`;
        }).join('')}</div>`;
      feed.querySelectorAll('.dm-user-item[data-user-id]').forEach(item => {
        const open = () => openChatWith(item.dataset.userId, item.dataset.username || 'user');
        item.addEventListener('click', open);
        item.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); open(); }
        });
      });
    } catch (e) {
      console.error('Messages inbox load failed:', e);
      feed.innerHTML = `<div style="padding:24px;color:var(--text-muted);">Messages could not be loaded. Please try again.</div>`;
    }
  }

  // --- V11: CHAT WITH DELETE MESSAGE FEATURE ---
  async function openChatWith(userId, username) {
    if (!currentUser) return openAuthModal();
    activeChatUser = { id: userId, username: username };
    currentMessageCount = 0;
    
    const feed = document.getElementById('feedContainer');
    document.getElementById('feedHeaderTitle').innerText = `Chat: @${username}`;

    feed.innerHTML = `
      <div class="chat-box-container">
        <div class="chat-messages" id="chatMessagesArea"><div style="text-align:center; color:var(--text-muted);">Loading...</div></div>
        <div class="chat-input-row">
          <input type="text" id="chatInputText" placeholder="Write a message..." onkeypress="if(event.key==='Enter') sendDirectMessage()">
          <button onclick="sendDirectMessage()">Send</button>
        </div>
      </div>
    `;

    await fetchAndRenderMessages(userId, true);
    if (chatPollTimer) clearTimeout(chatPollTimer);
    runBackupPoller(userId);

    if (realtimeChatSubscription) sb.removeChannel(realtimeChatSubscription);
    
    // Realtime connection for Insert and Delete events
    realtimeChatSubscription = sb.channel('public:messages')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, (payload) => {
        // If a message was deleted or inserted, re-fetch messages instantly
        if (activeChatUser) {
          fetchAndRenderMessages(activeChatUser.id, false);
        }
      })
      .subscribe();
  }

  async function runBackupPoller(userId) {
    if (!activeChatUser || activeChatUser.id !== userId) return;
    await fetchAndRenderMessages(userId, false);
    chatPollTimer = setTimeout(() => runBackupPoller(userId), 3000);
  }

  async function fetchAndRenderMessages(userId, forceScrollDown) {
    try {
      const { data: msgs, error } = await sb.from('messages')
        .select('*')
        .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${userId}),and(sender_id.eq.${userId},receiver_id.eq.${currentUser.id})`)
        .order('created_at', { ascending: true });

      if (error || !msgs) return;
      if (!forceScrollDown && msgs.length === currentMessageCount) return; 
      
      currentMessageCount = msgs.length;

      let chatHtml = msgs.map(m => {
        const isSent = m.sender_id === currentUser.id;
        const timeStr = formatTime(m.created_at);
        // Tap/Click bubble to delete your own message
        const clickAction = isSent ? `onclick="deleteMessage('${m.id}')"` : '';
        const titleTip = isSent ? `title="Tap to delete message"` : '';

        return `
          <div class="chat-bubble ${isSent ? 'sent' : 'received'}" ${clickAction} ${titleTip}>
            <div>${escapeHtml(m.message)}</div>
            <div class="chat-time">${timeStr}</div>
          </div>`;
      }).join('');

      const chatArea = document.getElementById('chatMessagesArea');
      if (chatArea) {
        chatArea.innerHTML = chatHtml || '<div style="text-align:center; color:var(--text-muted);">Say Hi! 👋 Tap your message to delete.</div>';
        if (forceScrollDown || msgs.length > currentMessageCount - 2) chatArea.scrollTop = chatArea.scrollHeight; 
      }
    } catch (e) {}
  }

  // DELETE MESSAGE FUNCTION
  async function deleteMessage(msgId) {
    if (!confirm("Delete this message?")) return;
    try {
      const { error } = await sb.from('messages').delete().eq('id', msgId);
      if (error) throw error;
      showToast("Message deleted 🗑️");
      if (activeChatUser) fetchAndRenderMessages(activeChatUser.id, false);
    } catch (e) {
      alert("Error deleting message: " + e.message);
    }
  }

  async function sendDirectMessage() {
    if (!currentUser || !activeChatUser) return;
    const input = document.getElementById('chatInputText');
    if (!input) return;
    const text = input.value.trim();
    if (!text) return;
    const recipientId = activeChatUser.id;
    input.disabled = true;
    try {
      const { error } = await sb.from('messages').insert([{
        sender_id: currentUser.id,
        receiver_id: recipientId,
        message: text
      }]);
      if (error) {
        showToast('Message failed: ' + error.message);
        return;
      }
      if (document.getElementById('chatInputText') === input) input.value = '';
      if (activeChatUser && activeChatUser.id === recipientId) {
        await fetchAndRenderMessages(recipientId, true);
      }
    } catch (e) {
      console.error('Message send failed:', e);
      showToast('Message failed. Please try again.');
    } finally {
      input.disabled = false;
    }
  }

  async function handleFileUpload(event) {
    if (!currentUser) { event.target.value = ''; return openAuthModal('login'); }
    const file = event.target.files?.[0];
    if (!file) return;
    const allowedTypes = new Set([
      'image/jpeg', 'image/png', 'image/webp', 'image/gif', 'image/avif',
      'video/mp4', 'video/webm', 'video/quicktime'
    ]);
    if (!allowedTypes.has(file.type)) {
      showToast('Use JPG, PNG, WebP, GIF, AVIF, MP4, WebM, or MOV media.');
      event.target.value = '';
      return;
    }
    if (file.size > 25 * 1024 * 1024) {
      showToast('Media must be under 25 MB.');
      event.target.value = '';
      return;
    }
    showToast('Uploading media... ⏳');
    try {
      const ext = (file.name.split('.').pop() || 'bin').replace(/[^a-z0-9]/gi, '');
      const filePath = `${currentUser.id}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
      const { error: upErr } = await sb.storage.from('media').upload(filePath, file);
      if (upErr) throw upErr;
      uploadedImageUrl = sb.storage.from('media').getPublicUrl(filePath).data.publicUrl;
      const isVideo = file.type.startsWith('video/');
      const img = document.getElementById('mediaPreviewImg');
      const video = document.getElementById('mediaPreviewVideo');
      img.style.display = isVideo ? 'none' : 'block';
      video.style.display = isVideo ? 'block' : 'none';
      if (isVideo) video.src = uploadedImageUrl; else img.src = uploadedImageUrl;
      document.getElementById('mediaPreviewContainer').style.display = 'block';
      showToast('Media ready! ✅');
    } catch (e) {
      console.error('Media upload failed:', e);
      showToast('Upload failed: ' + (e.message || 'Please try again.'));
      event.target.value = '';
    }
  }

  async function handleAvatarUpload(event) {
    if (!currentUser) return openAuthModal('login');
    const file = event.target.files[0]; if (!file) return;
    const allowedAvatarTypes = new Set(['image/jpeg', 'image/png', 'image/webp', 'image/gif', 'image/avif']);
    if (!allowedAvatarTypes.has(file.type)) { showToast('Use a JPG, PNG, WebP, GIF, or AVIF image.'); event.target.value = ''; return; }
    if (file.size > 5 * 1024 * 1024) { showToast('Profile photo must be under 5 MB.'); return; }
    showToast('Uploading profile photo...');
    const ext = (file.name.split('.').pop() || 'jpg').replace(/[^a-z0-9]/gi, '');
    const path = `${currentUser.id}/avatar-${Date.now()}.${ext}`;
    const { error: uploadError } = await sb.storage.from('media').upload(path, file);
    if (uploadError) { alert('Profile photo upload failed: ' + uploadError.message); return; }
    const url = sb.storage.from('media').getPublicUrl(path).data.publicUrl;
    const { data, error } = await sb.auth.updateUser({ data: { avatar_url: url } });
    if (error) { alert('Photo uploaded, but profile update failed: ' + error.message); return; }
    currentUser = data.user || currentUser;
    const existing = await loadMyProfileRecord();
    const username = existing?.username || currentUser.user_metadata?.username || currentUser.email?.split('@')[0] || 'user';
    const bio = existing?.bio || currentUser.user_metadata?.bio || '';
    const profileRow = { user_id: currentUser.id, username, bio, avatar_url: url, updated_at: new Date().toISOString() };
    const { error: profileError } = await sb.from('public_profiles').upsert(profileRow, { onConflict: 'user_id' });
    if (profileError) console.warn('Photo updated in auth, but public_profiles sync failed:', profileError.message);
    myProfile = profileRow; profileCache[currentUser.id] = profileRow;
    updateAuthUI();
    const editAvatar = document.getElementById('profileEditAvatar');
    if (editAvatar) editAvatar.innerHTML = `<img src="${escapeHtml(url)}" alt="Your profile photo">`;
    await loadFeed();
    showToast(profileError ? 'Photo updated; public profile sync needs retry.' : 'Profile photo updated! ✅');
    event.target.value = '';
  }

  function removeMedia() {
    uploadedImageUrl = '';
    document.getElementById('mediaUpload').value = '';
    document.getElementById('mediaPreviewContainer').style.display = 'none';
    document.getElementById('mediaPreviewImg').src = '';
    document.getElementById('mediaPreviewVideo').pause();
    document.getElementById('mediaPreviewVideo').src = '';
  }

  async function submitPost() {
    // Always verify the real Supabase session before attempting an RLS-protected write.
    let session = null;
    try {
      const { data, error: sessionError } = await sb.auth.getSession();
      if (sessionError) throw sessionError;
      session = data?.session || null;
    } catch (e) {
      console.error('Could not verify Supabase session before posting:', e);
      currentUser = null;
      updateAuthUI();
      showToast('Could not verify your login. Please log in again.');
      openAuthModal('login');
      return;
    }

    if (!session?.user) {
      currentUser = null;
      myProfile = null;
      await loadUserSocialState();
      updateAuthUI();
      showToast('Please log in before posting.');
      openAuthModal('login');
      return;
    }

    const user = session.user;
    currentUser = user;
    updateAuthUI();

    let content = document.getElementById('postInput').value.trim();
    if (uploadedImageUrl) content += (content ? '\n' : '') + uploadedImageUrl;
    if (!content) return showToast('Write something or add media first.');

    const username = user.user_metadata?.username || user.email?.split('@')[0] || myProfile?.username || 'user';
    const { error } = await sb.from('posts').insert([{ user_id: user.id, username, content }]);
    if (error) {
      console.error('Post insert failed:', { code: error.code, message: error.message });
      if (error.code === '42501' || /row-level security policy/i.test(error.message || '')) {
        showToast('Post blocked by security policy. Log out, log in again, and retry.');
      } else {
        showToast('Post failed: ' + error.message);
      }
      return;
    }

    document.getElementById('postInput').value = '';
    removeMedia();
    showToast('Posted successfully! 🚀');
    await loadFeed();
  }


  const tabHistory = [];
  function goBack() {
    // Back from an individual chat returns to the message inbox.
    if (activeChatUser) {
      switchTab('messages');
      return;
    }
    const previous = tabHistory.pop();
    if (previous && previous !== currentTab) {
      switchTab(previous, true);
    } else {
      switchTab('foryou', true);
    }
  }

  function switchTab(tab, restoring = false) {
    const allowedTabs = ['foryou', 'following', 'bookmarks', 'notifications', 'messages'];
    if (!allowedTabs.includes(tab)) tab = 'foryou';
    try {
      if (!restoring && currentTab !== tab) {
        tabHistory.push(currentTab);
        if (tabHistory.length > 30) tabHistory.shift();
      }
      currentTab = tab;
      try { localStorage.setItem('m_last_tab', tab); } catch (_) {}
      activeChatUser = null;
      if (chatPollTimer) { clearTimeout(chatPollTimer); chatPollTimer = null; }
      if (realtimeChatSubscription) { sb.removeChannel(realtimeChatSubscription); realtimeChatSubscription = null; }

      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('mainTabs').querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('composerBox').style.display = 'none';
      document.getElementById('mainTabs').style.display = 'none';

      if (tab === 'foryou') {
        document.getElementById('composerBox').style.display = 'flex';
        document.getElementById('mainTabs').style.display = 'flex';
        document.getElementById('btnNavHome').classList.add('active');
        document.getElementById('tabForYou').classList.add('active');
        document.getElementById('feedHeaderTitle').innerText = 'Home';
        loadFeed();
      } else if (tab === 'following') {
        document.getElementById('composerBox').style.display = 'flex';
        document.getElementById('mainTabs').style.display = 'flex';
        document.getElementById('btnNavHome').classList.add('active');
        document.getElementById('tabFollowing').classList.add('active');
        document.getElementById('feedHeaderTitle').innerText = 'Following';
        loadFeed();
      } else if (tab === 'bookmarks') {
        document.getElementById('btnNavBookmarks').classList.add('active');
        document.getElementById('feedHeaderTitle').innerText = 'Bookmarks';
        loadFeed();
      } else if (tab === 'notifications') {
        document.getElementById('btnNavNotif').classList.add('active');
        document.getElementById('feedHeaderTitle').innerText = 'Notifications';
        loadNotifications();
      } else if (tab === 'messages') {
        document.getElementById('btnNavMessages').classList.add('active');
        document.getElementById('feedHeaderTitle').innerText = 'Messages';
        loadMessagesInbox();
      }
    } catch (e) { console.error('Tab navigation failed:', e); }
  }

  async function loadMyProfileRecord() {
    if (!currentUser) { myProfile = null; return null; }
    const { data, error } = await sb.from('public_profiles').select('user_id, username, bio, avatar_url, updated_at').eq('user_id', currentUser.id).maybeSingle();
    if (error) { console.warn('Could not load public profile:', error.message); return null; }
    const meta = currentUser.user_metadata || {};
    const fallback = { user_id: currentUser.id, username: meta.username || currentUser.email?.split('@')[0] || 'user', bio: meta.bio || '', avatar_url: meta.avatar_url || '' };
    myProfile = data || fallback;
    profileCache[currentUser.id] = myProfile;
    return myProfile;
  }

  async function loadProfilesForPosts(posts) {
    const ids = [...new Set((posts || []).map(p => p.user_id).filter(Boolean).filter(id => !profileCache[id]))];
    if (!ids.length) return;
    try {
      const { data, error } = await sb.from('public_profiles').select('user_id, username, bio, avatar_url').in('user_id', ids);
      if (!error) (data || []).forEach(row => { profileCache[row.user_id] = row; });
    } catch (e) { console.warn('Public profile lookup failed:', e); }
  }

  function profileDisplayName(userId, fallback) {
    return profileCache[userId]?.username || fallback || 'user';
  }

  async function openMyProfile() {
    if (!currentUser) { openAuthModal('login'); return; }
    await loadMyProfileRecord();
    const prof = myProfile || { username: currentUser.user_metadata?.username || currentUser.email?.split('@')[0] || '', bio: '', avatar_url: currentUser.user_metadata?.avatar_url || '' };
    document.getElementById('profileModalTitle').innerText = 'Edit your profile';
    document.getElementById('profileEditor').style.display = 'block';
    document.getElementById('profileViewer').style.display = 'none';
    document.getElementById('profileUsernameInput').value = prof.username || '';
    document.getElementById('profileBioInput').value = prof.bio || '';
    updateProfileBioCount();
    const av = document.getElementById('profileEditAvatar');
    av.innerHTML = prof.avatar_url ? `<img src="${escapeHtml(prof.avatar_url)}" alt="Your profile photo">` : escapeHtml((prof.username || 'M').charAt(0).toUpperCase());
    document.getElementById('profilePosts').innerHTML = '<div style="padding:14px;color:var(--text-muted);">Your profile is public. Tap Save profile after making changes.</div>';
    document.getElementById('profileModal').style.display = 'flex';
  }

  function updateProfileBioCount() {
    const el = document.getElementById('profileBioInput');
    const out = document.getElementById('profileBioCount');
    if (el && out) out.textContent = `${el.value.length}/160`;
  }
  document.addEventListener('input', function(e) { if (e.target?.id === 'profileBioInput') updateProfileBioCount(); });

  async function saveMyProfile() {
    if (!currentUser) { openAuthModal('login'); return; }
    const username = document.getElementById('profileUsernameInput').value.trim();
    const bio = document.getElementById('profileBioInput').value.trim();
    if (!/^[a-zA-Z0-9_.]{2,20}$/.test(username)) { showToast('Username: 2–20 letters, numbers, _ or .'); return; }
    if (bio.length > 160) { showToast('Bio must be 160 characters or less.'); return; }
    const avatar_url = currentUser.user_metadata?.avatar_url || myProfile?.avatar_url || null;
    const profileRow = { user_id: currentUser.id, username, bio, avatar_url, updated_at: new Date().toISOString() };
    const btn = document.querySelector('#profileEditor .dark-cta-btn:last-of-type');
    if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
    try {
      const { error } = await sb.from('public_profiles').upsert(profileRow, { onConflict: 'user_id' });
      if (error) {
        const message = /duplicate key|unique/i.test(error.message) ? 'That username is already taken.' : `Profile save failed: ${error.message}`;
        showToast(message); return;
      }
      const { data, error: metaError } = await sb.auth.updateUser({ data: { username, bio, avatar_url } });
      if (metaError) console.warn('Auth metadata sync warning:', metaError.message);
      if (data?.user) currentUser = data.user;
      myProfile = profileRow; profileCache[currentUser.id] = profileRow;
      updateAuthUI();
      await loadFeed();
      showToast('Profile saved ✅');
      closeModal('profileModal');
    } catch (e) {
      showToast('Profile save failed. Please try again.');
      console.error(e);
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = 'Save profile'; }
    }
  }

  async function openPublicProfile(userId, fallbackUsername = 'user') {
    if (!userId) return;
    document.getElementById('profileModalTitle').innerText = 'Public profile';
    document.getElementById('profileEditor').style.display = 'none';
    document.getElementById('profileViewer').style.display = 'block';
    document.getElementById('profileViewName').textContent = fallbackUsername || 'User';
    document.getElementById('profileViewHandle').textContent = '@' + (fallbackUsername || 'user');
    document.getElementById('profileViewBio').textContent = 'Loading profile…';
    document.getElementById('profilePosts').innerHTML = '<div style="padding:16px;color:var(--text-muted);">Loading posts…</div>';
    document.getElementById('profileModal').style.display = 'flex';
    try {
      let prof = profileCache[userId];
      const { data, error } = await sb.from('public_profiles').select('user_id, username, bio, avatar_url').eq('user_id', userId).maybeSingle();
      if (!error && data) { prof = data; profileCache[userId] = data; }
      const name = prof?.username || fallbackUsername || 'user';
      document.getElementById('profileViewName').textContent = name;
      document.getElementById('profileViewHandle').textContent = '@' + name;
      document.getElementById('profileViewBio').textContent = prof?.bio || 'No bio yet.';
      const av = document.getElementById('profileViewAvatar');
      av.innerHTML = prof?.avatar_url ? `<img src="${escapeHtml(prof.avatar_url)}" alt="${escapeHtml(name)} profile photo">` : escapeHtml(name.charAt(0).toUpperCase());
      const { data: posts, error: postError } = await sb.from('posts').select('*, likes(*), comments(*)').eq('user_id', userId).order('created_at', { ascending: false }).limit(20);
      if (postError) throw postError;
      const list = posts || [];
      await loadProfilesForPosts(list);
      const saved = allPosts;
      const savedTab = currentTab;
      allPosts = list;
      document.getElementById('profilePosts').innerHTML = list.length ? generatePostsHtml(list) : '<div style="padding:16px;color:var(--text-muted);">No posts yet.</div>';
      allPosts = saved;
      currentTab = savedTab;
    } catch (e) {
      console.warn('Public profile loading failed:', e);
      document.getElementById('profileViewBio').textContent = 'Profile details could not be loaded. Please try again.';
      document.getElementById('profilePosts').innerHTML = '<div style="padding:12px;color:var(--text-muted);">Could not load posts.</div>';
    }
  }

  function handleSearch() { const q = document.getElementById('searchInput').value.toLowerCase(); document.getElementById('feedContainer').innerHTML = generatePostsHtml(allPosts.filter(p => (p.content||'').toLowerCase().includes(q) || (p.username||'').toLowerCase().includes(q))); }
  function escapeHtml(str) { return (str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m]); }

  let isSignUpMode = true;
  function openAuthModal(mode = 'login') { isSignUpMode = (mode === 'signup'); document.getElementById('authModal').style.display = 'flex'; }
  function toggleAuthMode() { isSignUpMode = !isSignUpMode; document.getElementById('authModalTitle').innerText = isSignUpMode ? "Create your Account" : "Log in to M"; }
  async function handleAuthSubmit() {
    const e = document.getElementById('authEmail').value.trim();
    const p = document.getElementById('authPassword').value;
    const u = document.getElementById('authUsername').value.trim();
    const wasSignUp = isSignUpMode;

    if (!e || !p) return alert('Please enter email and password!');
    if (wasSignUp && !/^[a-zA-Z0-9_.]{2,20}$/.test(u)) {
      return alert('Username must be 2–20 characters (letters, numbers, _ or .).');
    }

    try {
      const res = wasSignUp
        ? await sb.auth.signUp({ email: e, password: p, options: { data: { username: u } } })
        : await sb.auth.signInWithPassword({ email: e, password: p });

      if (res.error) {
        alert(res.error.message);
        return;
      }

      // signUp may return a user but no session when email confirmation is enabled.
      // Such a user is not authenticated and must not be allowed to write RLS-protected rows.
      const sessionUser = res.data?.session?.user || null;
      if (!sessionUser) {
        currentUser = null;
        myProfile = null;
        await loadUserSocialState();
        updateAuthUI();
        closeModal('authModal');
        if (wasSignUp) {
          alert('Account created. Please confirm your email, then log in before posting.');
        } else {
          alert('No active login session was returned. Please check your email/password and try again.');
        }
        return;
      }

      currentUser = sessionUser;
      closeModal('authModal');
      updateAuthUI();

      if (wasSignUp) {
        const username = currentUser.user_metadata?.username || u;
        const profileRow = {
          user_id: currentUser.id,
          username,
          bio: '',
          avatar_url: currentUser.user_metadata?.avatar_url || null,
          updated_at: new Date().toISOString()
        };
        const { error: profileError } = await sb.from('public_profiles').upsert(profileRow, { onConflict: 'user_id' });
        if (!profileError) {
          myProfile = profileRow;
          profileCache[currentUser.id] = profileRow;
        } else {
          console.warn('Profile row will be created when edited:', profileError.message);
        }
      } else {
        await loadMyProfileRecord();
      }

      await loadUserSocialState();
      showToast(wasSignUp ? 'Account created! 🎉' : 'Login successful! 🎉');
      await loadFeed();
    } catch (e) {
      console.error('Authentication submit failed:', e);
      alert('Authentication failed: ' + (e?.message || 'Please try again.'));
    }
  }

  async function handleLogout() { await sb.auth.signOut(); currentUser = null; await loadUserSocialState(); updateAuthUI(); showToast('Logged out 👋'); loadFeed(); }
  
  sb.auth.onAuthStateChange((_event, session) => {
    const nextUser = session ? session.user : null;
    const changed = (currentUser?.id || null) !== (nextUser?.id || null);
    currentUser = nextUser;
    updateAuthUI();
    if (changed) {
      myProfile = null;
      if (currentUser) loadMyProfileRecord();
      loadUserSocialState().then(() => {
        if (socialStateLoadedFor === (currentUser?.id || null)) renderFeed(allPosts);
      });
    }
  });
  window.addEventListener('DOMContentLoaded', () => { init(); });
  // Extra safety: reveal the interface if initialization never completes.
  window.setTimeout(() => document.body.classList.add('app-ready'), 4000);
</script>
