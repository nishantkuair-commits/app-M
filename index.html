<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M</title>
<meta name="description" content="Short thoughts, shared.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root { --bg: #ffffff; --ink: #0a0a0a; --muted: #6b6b6b; --line: #e8e8e8; --soft: #f4f4f4; --btn: #0a0a0a; --btn-ink: #ffffff; }
@media (prefers-color-scheme: dark) { :root { --bg: #000000; --ink: #f2f2f2; --muted: #8c8c8c; --line: #222222; --soft: #121212; --btn: #f2f2f2; --btn-ink: #000000; } }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Inter", -apple-system, sans-serif; }
.topbar { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.topbar-inner { max-width: 600px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
.logo { width: 36px; height: 36px; border-radius: 10px; background: var(--btn); color: var(--btn-ink); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; }
.brand h1 { margin: 0; font-size: 18px; font-weight: 700; }
.brand .sub { font-size: 12px; color: var(--muted); }
.page { max-width: 600px; margin: 0 auto; padding: 0 16px 24px; }
.panel { padding: 18px 0; border-bottom: 1px solid var(--line); }
.panel h2 { margin: 0 0 4px; font-size: 22px; font-weight: 700; }
.hint { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
.fineprint { margin: 14px 0 0; font-size: 12px; color: var(--muted); line-height: 1.5; }
.fineprint a, .footer a { color: var(--ink); text-decoration: underline; cursor: pointer; }
label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 12px 0 6px; }
input, textarea { width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; outline: none; }
input:focus, textarea:focus { border-color: var(--ink); }
textarea { resize: none; }
.row { display: flex; gap: 10px; margin-top: 16px; }
.btn { font: inherit; font-size: 15px; font-weight: 600; border: 1px solid var(--btn); background: var(--btn); color: var(--btn-ink); padding: 10px 20px; border-radius: 999px; cursor: pointer; }
.btn:hover { opacity: 0.85; }
.btn.outline { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.full { flex: 1; }
.composer-row { display: flex; gap: 12px; }
.composer-main { flex: 1; min-width: 0; }
.who { font-size: 14px; }
.who strong { font-weight: 700; }
.who span { color: var(--muted); font-size: 13px; margin-left: 6px; }
.composer textarea { border: none; border-radius: 0; padding: 8px 0; height: 80px; }
.composer-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 6px; }
.counter { font-size: 13px; color: var(--muted); }
.actions { display: flex; gap: 8px; }
.feed-title { margin: 22px 0 0; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.post { display: flex; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--soft); color: var(--ink); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
.avatar.mine { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
.post-main { flex: 1; min-width: 0; }
.post-top { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.post-name { font-weight: 700; font-size: 15px; }
.post-time { font-size: 13px; color: var(--muted); }
.post-body { margin: 4px 0 0; font-size: 16px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
.post-actions { display: flex; align-items: center; gap: 8px; margin-top: 8px; margin-left: -8px; }
.icon-btn { display: inline-flex; align-items: center; gap: 6px; background: none; border: none; color: var(--muted); font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 999px; cursor: pointer; }
.icon-btn:hover { color: var(--ink); background: var(--soft); }
.icon-btn.liked { color: #e0245e; }
.empty { text-align: center; color: var(--muted); padding: 40px 10px; }
.footer { max-width: 600px; margin: 0 auto; padding: 16px; font-size: 13px; color: var(--muted); text-align: center; }
.footer a { margin: 0 8px; color: var(--muted); }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
.modal.show { display: flex; }
.modal-box { background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 16px; max-width: 560px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 22px; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--btn); color: var(--btn-ink); padding: 10px 18px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 60; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="logo">M</div>
    <div class="brand"><h1>M</h1><div class="sub">Short thoughts, shared.</div></div>
  </div>
</header>
<div class="page">
  <form id="authBox" class="panel" style="display:none" onsubmit="event.preventDefault(); login();">
    <h2>Welcome</h2>
    <p class="hint">Log in, or create a new account.</p>
    <label for="username">Username (for signup)</label>
    <input id="username" type="text" placeholder="e.g. nishant_01" maxlength="20">
    <label for="email">Email</label>
    <input id="email" type="email" placeholder="you@example.com">
    <label for="password">Password</label>
    <input id="password" type="password" placeholder="Password (min 6 chars)">
    <div class="row">
      <button type="submit" class="btn full">Log in</button>
      <button type="button" class="btn outline full" onclick="signUp()">Sign up</button>
    </div>
    <p class="fineprint">By signing up you agree to the <a onclick="openLegal('terms')">Terms</a> and <a onclick="openLegal('privacy')">Privacy Policy</a>.</p>
  </form>

  <section id="postBox" class="panel composer" style="display:none">
    <div class="composer-row">
      <div id="avatarMe" class="avatar mine">?</div>
      <div class="composer-main">
        <div class="who"><strong id="displayName"></strong> <span id="userEmail"></span></div>
        <textarea id="postText" placeholder="What's on your mind?" maxlength="280" oninput="updateCounter()"></textarea>
        <div class="composer-foot">
          <span class="counter"><span id="charCount">0</span>/280</span>
          <div class="actions">
            <button class="btn outline" onclick="logOut()">Log out</button>
            <button id="postBtn" class="btn" onclick="addPost()">Post</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <h2 class="feed-title">Latest</h2>
  <div id="feed"></div>
</div>

<div class="footer"><a onclick="openLegal('terms')">Terms</a> • <a onclick="openLegal('privacy')">Privacy</a></div>
<div id="legal" class="modal" onclick="if(event.target===this) closeLegal()"><div class="modal-box"><h2 id="legalTitle"></h2><div id="legalBody"></div><div class="row" style="margin-top:20px"><button class="btn full" onclick="closeLegal()">Close</button></div></div></div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://obhzdfmbpgjfqgjdovng.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9iaHpkZm1icGdqZnFnamRvdm5nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1OTI0NDQsImV4cCI6MjEwNzE2ODQ0NH0.GgyFMuDWVll124VONThOC9znxcTE_QzraDdaDck7yug";
const CONTACT_NAME = "Nishant Kumar";
const CONTACT_EMAIL = "nishantku0401@gmail.com";

const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentUser = null;
let isPosting = false, isLoggingIn = false;

const LEGAL = {
  terms: { title: "Terms of Use", body: `<p>Grievance Officer: ${CONTACT_NAME} (${CONTACT_EMAIL})</p><p>1. Must be 18+ to post.<br>2. Abusive/illegal content strictly prohibited.<br>3. Governed by IT Rules of India.</p>` },
  privacy: { title: "Privacy Notice", body: `<p>We only store your username/email for auth sessions.<br>To delete account, contact: ${CONTACT_EMAIL}</p>` }
};

function openLegal(w) { document.getElementById("legalTitle").textContent = LEGAL[w].title; document.getElementById("legalBody").innerHTML = LEGAL[w].body; document.getElementById("legal").classList.add("show"); }
function closeLegal() { document.getElementById("legal").classList.remove("show"); }
function showToast(m) { const t = document.getElementById("toast"); t.textContent = m; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2500); }
function updateCounter() { document.getElementById("charCount").textContent = document.getElementById("postText").value.length; }

async function init() {
  const { data } = await db.auth.getSession();
  currentUser = data.session ? data.session.user : null;
  updateUI();
  loadPosts();
  db.auth.onAuthStateChange((_e, s) => { currentUser = s ? s.user : null; updateUI(); loadPosts(); });
}

function updateUI() {
  const inUser = currentUser !== null;
  document.getElementById("authBox").style.display = inUser ? "none" : "block";
  document.getElementById("postBox").style.display = inUser ? "block" : "none";
  if (inUser) {
    const name = (currentUser.user_metadata || {}).username || currentUser.email.split('@')[0];
    document.getElementById("displayName").textContent = name;
    document.getElementById("userEmail").textContent = currentUser.email;
    document.getElementById("avatarMe").textContent = name.charAt(0).toUpperCase();
  }
}

async function signUp() {
  if (isLoggingIn) return;
  const username = document.getElementById("username").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  if (!username || !email || !password) return showToast("All fields required");
  isLoggingIn = true;
  const { error } = await db.auth.signUp({ email, password, options: { data: { username } } });
  isLoggingIn = false;
  if (error) return showToast(error.message);
  showToast("Account created! Logging in...");
  login();
}

async function login() {
  if (isLoggingIn) return;
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  if (!email || !password) return showToast("Enter credentials");
  isLoggingIn = true;
  const { error } = await db.auth.signInWithPassword({ email, password });
  isLoggingIn = false;
  if (error) showToast(error.message);
}

async function logOut() { await db.auth.signOut(); showToast("Logged out"); }

async function addPost() {
  if (isPosting || !currentUser) return;
  const tb = document.getElementById("postText");
  const text = tb.value.trim();
  if (!text) return;
  isPosting = true;
  const name = (currentUser.user_metadata || {}).username || currentUser.email.split('@')[0];
  const { error } = await db.from("posts").insert({ content: text, user_id: currentUser.id, username: name });
  isPosting = false;
  if (error) return showToast(error.message);
  tb.value = ""; updateCounter(); showToast("Posted!"); loadPosts();
}

async function deletePost(id) {
  if (!confirm("Delete post?")) return;
  await db.from("posts").delete().eq("id", id);
  loadPosts();
}

async function toggleLike(postId, liked) {
  if (!currentUser) return showToast("Login first");
  if (liked) await db.from("likes").delete().eq("post_id", postId).eq("user_id", currentUser.id);
  else await db.from("likes").insert({ post_id: postId, user_id: currentUser.id });
  loadPosts();
}

async function reportPost(postId) {
  if (!currentUser) return showToast("Login first");
  const r = prompt("Reason for report:");
  if (!r) return;
  const { error } = await db.from("reports").insert({ post_id: postId, reporter_id: currentUser.id, reason: r });
  if (error && error.code === '23505') showToast("Already reported");
  else showToast("Report submitted");
}

async function loadPosts() {
  const { data: posts, error } = await db.from("posts").select("*, likes(user_id)").order("created_at", { ascending: false });
  if (error) return;
  const feed = document.getElementById("feed");
  if (!posts || posts.length === 0) { feed.innerHTML = '<div class="empty">No posts yet. Say something!</div>'; return; }
  feed.innerHTML = posts.map(p => {
    const isMine = currentUser && currentUser.id === p.user_id;
    const isLiked = currentUser && p.likes && p.likes.some(l => l.user_id === currentUser.id);
    const count = p.likes ? p.likes.length : 0;
    return `
      <div class="post">
        <div class="avatar">${(p.username || '?').charAt(0).toUpperCase()}</div>
        <div class="post-main">
          <div class="post-top"><span class="post-name">@${p.username || 'user'}</span><span class="post-time">${new Date(p.created_at).toLocaleDateString()}</span></div>
          <div class="post-body">${p.content}</div>
          <div class="post-actions">
            <button class="icon-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike(${p.id}, ${isLiked})">❤️ ${count}</button>
            <button class="icon-btn" onclick="reportPost(${p.id})">🚩 Report</button>
            ${isMine ? `<button class="icon-btn" onclick="deletePost(${p.id})">🗑️ Delete</button>` : ''}
          </div>
        </div>
      </div>
    `;
  }).join('');
}
init();
</script>
</body>
  </html>
