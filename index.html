<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>M — Your voice, your space</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    /* UI Colors */
    :root {
      --bg: #ffffff; --border: #f1f5f9; --border-dark: #e2e8f0; --text-main: #0f172a;
      --text-muted: #64748b; --accent-lime: #bef264; --x-blue: #1d9bf0; --x-pink: #f91880; --x-green: #00ba7c;
      --card-hover: #fafafa; --widget-bg: #f8fafc;
    }
    body.dark-mode {
      --bg: #000000; --border: #2f3336; --border-dark: #38444d; --text-main: #e7e9ea;
      --text-muted: #71767b; --card-hover: #16181c; --widget-bg: #16181c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; overflow-y: scroll; transition: background 0.2s, color 0.2s; }
    .app-container { display: flex; width: 100%; max-width: 1260px; min-height: 100vh; }
    
    /* LEFT SIDEBAR */
    .left-rail { width: 84px; padding: 24px 14px; display: flex; flex-direction: column; align-items: center; gap: 18px; border-right: 1px solid var(--border); position: sticky; top: 0; height: 100vh; }
    .brand-logo { width: 48px; height: 48px; background: var(--text-main); color: var(--bg); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; cursor: pointer; position: relative; }
    .nav-btn { width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: var(--text-muted); border: none; background: transparent; cursor: pointer; transition: 0.2s; }
    .nav-btn:hover, .nav-btn.active { background: var(--border); color: var(--text-main); }
    .nav-btn svg { width: 24px; height: 24px; stroke-width: 2.2; }
    .post-fab { margin-top: auto; width: 48px; height: 48px; border-radius: 16px; background: var(--accent-lime); border: none; cursor: pointer; font-size: 26px; font-weight: 700; color: #1a2e05; }
    
    /* CENTER FEED */
    .center-col { flex: 1; max-width: 660px; border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 100vh; }
    .feed-header { padding: 20px 24px 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: rgba(255,255,255,0.8); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 10; }
    body.dark-mode .feed-header { background: rgba(0,0,0,0.8); }
    .feed-header h1 { font-size: 22px; font-weight: 800; }
    .feed-header p { font-size: 13px; color: var(--text-muted); }
    
    .tabs-bar { display: flex; border-bottom: 1px solid var(--border); padding: 0 16px; gap: 32px; }
    .tab-btn { background: none; border: none; padding: 14px 6px; font-size: 14px; font-weight: 600; color: var(--text-muted); cursor: pointer; position: relative; }
    .tab-btn.active { color: var(--text-main); font-weight: 700; }
    .tab-btn.active::after { content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 3px; background: #84cc16; border-radius: 4px 4px 0 0; }
    
    /* COMPOSER */
    .composer-box { padding: 18px 24px; border-bottom: 1px solid var(--border); display: flex; gap: 16px; }
    .user-avatar img { width:100%; height:100%; object-fit:cover; border-radius:50%; display:block; }
    .user-avatar { overflow:hidden; width: 44px; height: 44px; border-radius: 50%; background: var(--border); color: var(--text-muted); font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .composer-main { flex: 1; }
    .composer-main textarea { width: 100%; border: none; outline: none; resize: none; font-family: inherit; font-size: 18px; color: var(--text-main); background: transparent; min-height: 60px; margin-top: 8px; }
    
    .media-preview-container { margin-top: 8px; display: none; position: relative; border-radius: 14px; overflow: hidden; max-height: 240px; border: 1px solid var(--border); }
    .media-preview-container img { width: 100%; height: auto; object-fit: cover; }
    .media-preview-remove { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.7); color: #fff; border: none; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; }
    
    .composer-footer { display: flex; justify-content: space-between; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
    .tool-icon-btn { background: none; border: none; color: var(--x-blue); cursor: pointer; padding: 8px; border-radius: 50%; }
    .tool-icon-btn:hover { background: rgba(29,155,240,0.1); }
    .post-submit-btn { background: var(--accent-lime); border: none; font-weight: 700; padding: 10px 24px; border-radius: 99px; cursor: pointer; color: #1a2e05; font-size: 15px; }
    
    /* POST CARDS */
    .feed-list { display: flex; flex-direction: column; padding-bottom: 60px; }
    .post-card { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; gap: 16px; transition: 0.15s; }
    .post-card:hover { background: var(--card-hover); }
    .post-body { flex: 1; min-width: 0; }
    .post-author-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
    .author-name { font-weight: 700; font-size: 16px; }
    .author-handle { font-size: 14px; color: var(--text-muted); }
    .post-time-badge { font-size: 12px; color: var(--text-muted); margin-left: auto; }
    .post-text { font-size: 16px; line-height: 1.5; word-break: break-word; margin-bottom: 12px; }
    .post-image-box { border-radius: 16px; overflow: hidden; border: 1px solid var(--border); margin-bottom: 12px; }
    .post-image-box img { width: 100%; height: auto; display: block; object-fit: cover; }
    
    .post-interactions { display: flex; justify-content: space-between; max-width: 420px; }
    .action-icon-btn { background: none; border: none; font-size: 14px; font-weight: 600; color: var(--text-muted); display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 8px; border-radius: 50px; }
    .action-icon-btn:hover { color: var(--x-blue); background: rgba(29,155,240,0.1); }
    .action-icon-btn.liked { color: var(--x-pink); }
    .action-icon-btn.bookmarked { color: var(--x-green); }
    
    /* COMMENTS */
    .comments-section { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); display: none; }
    .comment-input-box { display: flex; gap: 12px; margin-bottom: 20px; }
    .comment-input-box input { flex: 1; padding: 10px 16px; border: 1px solid var(--border-dark); background: var(--bg); color: var(--text-main); border-radius: 99px; outline: none; }
    .comment-input-box button { background: var(--text-main); color: var(--bg); border: none; padding: 0 20px; border-radius: 99px; font-weight: 700; cursor: pointer; }
    .comment-item { display: flex; gap: 12px; margin-bottom: 16px; font-size: 14px; background: var(--widget-bg); padding: 12px; border-radius: 12px; }
    
    /* DMS & CHAT */
    .dm-user-item, .notif-item { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; cursor: pointer; }
    .dm-user-item:hover, .notif-item:hover { background: var(--card-hover); }
    .chat-box-container { display: flex; flex-direction: column; height: calc(100vh - 75px); }
    .chat-messages { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
    
    .chat-bubble { max-width: 75%; padding: 10px 16px; border-radius: 18px; font-size: 15px; line-height: 1.4; word-break: break-word; min-width: 80px; position: relative; cursor: pointer; user-select: none; }
    .chat-bubble.sent { background: var(--x-blue); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
    .chat-bubble.received { background: var(--border-dark); color: var(--text-main); align-self: flex-start; border-bottom-left-radius: 4px; }
    .chat-time { font-size: 10px; opacity: 0.7; margin-top: 4px; text-align: right; }
    .chat-input-row { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; gap: 12px; background: var(--bg); }
    .chat-input-row input { flex: 1; padding: 12px 20px; border: 1px solid var(--border-dark); background: transparent; color: var(--text-main); border-radius: 99px; outline: none; }
    .chat-input-row button { background: var(--x-blue); color: #fff; border: none; padding: 0 24px; border-radius: 99px; font-weight: 700; cursor: pointer; }

    /* RIGHT SIDEBAR */
    .right-col { width: 350px; padding: 24px 20px; display: flex; flex-direction: column; gap: 20px; position: sticky; top: 0; height: 100vh; }
    .search-box { background: var(--widget-bg); border: 1px solid var(--border-dark); border-radius: 99px; padding: 12px 20px; display: flex; align-items: center; gap: 12px; }
    .search-box input { background: none; border: none; outline: none; width: 100%; font-size: 15px; color: var(--text-main); }
    .widget-card { background: var(--widget-bg); border: 1px solid var(--border); border-radius: 24px; padding: 24px; }
    .dark-cta-btn { width: 100%; background: var(--text-main); color: var(--bg); border: none; padding: 12px; border-radius: 99px; font-weight: 700; font-size: 15px; cursor: pointer; }
    
    /* MODALS & TOAST */
    .toast-box { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--x-blue); color: #fff; padding: 12px 24px; border-radius: 99px; font-size: 14px; font-weight: 700; display: none; z-index: 1000; box-shadow: 0 10px 15px -3px rgba(29,155,240,0.3); }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 999; backdrop-filter: blur(4px); }
    .modal-content { background: var(--bg); border: 1px solid var(--border); border-radius: 24px; width: 90%; max-width: 420px; padding: 32px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; color: var(--text-muted); }
    .form-group input { width: 100%; padding: 12px 16px; border: 1px solid var(--border-dark); background: transparent; color: var(--text-main); border-radius: 12px; outline: none; font-size: 15px; }
    
    @media (max-width: 960px) { .right-col { display: none; } .center-col { max-width: 100%; border-right: none; } }
  </style>
</head>
<body id="appBody">

<div class="app-container">
  <!-- LEFT NAV MENU -->
  <aside class="left-rail">
    <!-- Notice v11 for Deletable Chat Bubbles -->
    <div class="brand-logo" onclick="switchTab('foryou')">M<span style="font-size:10px; position:absolute; bottom:2px; right:4px; color:var(--accent-lime);">v11</span></div>
    
    <button class="nav-btn active" id="btnNavHome" onclick="switchTab('foryou')">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
    </button>
    <button class="nav-btn" id="btnNavMessages" onclick="switchTab('messages')">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
    </button>
    <button class="nav-btn" id="btnNavNotif" onclick="switchTab('notifications')">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
    </button>
    <button class="nav-btn" id="btnNavBookmarks" onclick="switchTab('bookmarks')">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/></svg>
    </button>
    <button class="nav-btn" onclick="toggleDarkMode()">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
    </button>
    <button class="post-fab" onclick="document.getElementById('postInput')?.focus()">+</button>
  </aside>

  <!-- CENTER MAIN AREA -->
  <main class="center-col">
    <div class="feed-header" id="mainHeader">
      <div><h1 id="feedHeaderTitle">Home</h1><p id="feedHeaderSub">A little space for what matters.</p></div>
    </div>

    <div class="tabs-bar" id="mainTabs">
      <button class="tab-btn active" id="tabForYou" onclick="switchTab('foryou')">For you ✨</button>
      <button class="tab-btn" id="tabFollowing" onclick="switchTab('following')">Following</button>
    </div>

    <!-- POST COMPOSER -->
    <div class="composer-box" id="composerBox">
      <div class="user-avatar" id="composerAvatar">M</div>
      <div class="composer-main">
        <textarea id="postInput" maxlength="280" placeholder="What's happening?"></textarea>
        <input type="file" id="mediaUpload" accept="image/*,video/*" style="display:none" onchange="handleFileUpload(event)">
        <input type="file" id="avatarUpload" accept="image/*" style="display:none" onchange="handleAvatarUpload(event)">
        <div class="media-preview-container" id="mediaPreviewContainer">
          <img id="mediaPreviewImg" src="" alt="preview" style="display:none"><video id="mediaPreviewVideo" controls style="display:none;width:100%;max-height:240px;"></video><button class="media-preview-remove" onclick="removeMedia()">✕</button>
        </div>
        <div class="composer-footer">
          <div class="composer-tools-left">
            <button class="tool-icon-btn" onclick="document.getElementById('mediaUpload').click()">
              <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            </button>
          </div>
          <button class="post-submit-btn" onclick="submitPost()">Post ↗</button>
        </div>
      </div>
    </div>

    <!-- FEED CONTAINER -->
    <div class="feed-list" id="feedContainer">
      <div style="padding: 40px; text-align: center; color: var(--text-muted); font-weight: 600;">Loading amazing content... ✨</div>
    </div>
  </main>

  <!-- RIGHT SIDEBAR -->
  <aside class="right-col">
    <div class="search-box">
      <svg width="20" height="20" fill="none" stroke="#94a3b8" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Search M..." oninput="handleSearch()">
    </div>
    <div class="widget-card" id="authWidget">
      <div class="widget-title" style="font-size: 18px; font-weight:800; margin-bottom:12px;">Join M today.</div>
      <button class="dark-cta-btn" onclick="openAuthModal('signup')">Create account</button>
    </div>
  </aside>
</div>

<!-- TOAST & MODAL -->
<div class="toast-box" id="toast">Alert</div>

<div class="modal-overlay" id="authModal">
  <div class="modal-content">
    <div class="modal-title" style="font-size:22px; font-weight:800; margin-bottom:20px;" id="authModalTitle">Welcome to M</div>
    <div class="form-group" id="usernameGroup">
      <label>Username</label><input type="text" id="authUsername" placeholder="e.g. nishant_01">
    </div>
    <div class="form-group">
      <label>Email Address</label><input type="email" id="authEmail" placeholder="you@example.com">
    </div>
    <div class="form-group">
      <label>Password</label><input type="password" id="authPassword" placeholder="••••••••">
    </div>
    <div style="display:flex; gap:12px; margin-top:24px;">
      <button class="dark-cta-btn" style="flex:1;" onclick="handleAuthSubmit()">Continue</button>
      <button class="dark-cta-btn" style="flex:1; background:var(--border); color:var(--text-main);" onclick="closeModal('authModal')">Cancel</button>
    </div>
    <div style="text-align: center; margin-top: 20px;"><a style="font-size: 14px; font-weight: 700; color: var(--x-blue); cursor: pointer;" onclick="toggleAuthMode()">Switch Login/Signup</a></div>
  </div>
</div>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js'); });
  }

  let bookmarks = []; try { bookmarks = JSON.parse(localStorage.getItem('m_bookmarks')); if(!Array.isArray(bookmarks)) bookmarks=[]; } catch(e){}
  let reposts = []; try { reposts = JSON.parse(localStorage.getItem('m_reposts')); if(!Array.isArray(reposts)) reposts=[]; } catch(e){}
  let following = []; try { following = JSON.parse(localStorage.getItem('m_following')); if(!Array.isArray(following)) following=[]; } catch(e){}
  
  if (localStorage.getItem('m_theme') === 'dark') { document.getElementById('appBody').classList.add('dark-mode'); }
  function toggleDarkMode() {
    const body = document.getElementById('appBody'); body.classList.toggle('dark-mode');
    localStorage.setItem('m_theme', body.classList.contains('dark-mode') ? 'dark' : 'light');
    showToast(body.classList.contains('dark-mode') ? 'Dark Mode 🌙' : 'Light Mode ☀️');
  }

  const SUPABASE_URL = "https://obhzdfmbpgjfqgjdovng.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9iaHpkZm1icGdqZnFnamRvdm5nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1OTI0NDQsImV4cCI6MjEwNzE2ODQ0NH0.GgyFMuDWVll124VONThOC9znxcTE_QzraDdaDck7yug";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUser = null;
  let allPosts = [];
  let currentTab = 'foryou'; 
  let activeChatUser = null;
  let uploadedImageUrl = '';
  
  let realtimeChatSubscription = null;
  let chatPollTimer = null;
  let currentMessageCount = 0;
  let feedRefreshTimer = null;
  
  async function init() {
    try {
      const { data: { session } } = await sb.auth.getSession();
      currentUser = session ? session.user : null;
    } catch (e) {}
    updateAuthUI();
    loadFeed();
    startFeedAutoRefresh();
  }

  function showToast(msg) { const t = document.getElementById('toast'); t.innerText = msg; t.style.display = 'block'; setTimeout(() => { t.style.display = 'none'; }, 2500); }
  function closeModal(id) { document.getElementById(id).style.display = 'none'; }

  function updateAuthUI() {
    const avatar = document.getElementById('composerAvatar');
    const widget = document.getElementById('authWidget');
    if (currentUser) {
      const name = currentUser.user_metadata?.username || currentUser.email.split('@')[0];
      const avatarUrl = currentUser.user_metadata?.avatar_url || '';
      avatar.innerHTML = avatarUrl ? `<img src="${escapeHtml(avatarUrl)}" alt="Your profile photo">` : escapeHtml(name.charAt(0).toUpperCase());
      widget.innerHTML = `<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;"><div class="user-avatar" style="width:48px;height:48px;">${avatarUrl ? `<img src="${escapeHtml(avatarUrl)}" alt="Profile photo">` : escapeHtml(name.charAt(0).toUpperCase())}</div><div class="widget-title" style="font-size:18px;font-weight:800;">Hi, @${escapeHtml(name)}!</div></div><button class="dark-cta-btn" onclick="document.getElementById('avatarUpload').click()">Change profile photo</button><button class="dark-cta-btn" style="margin-top:8px;" onclick="handleLogout()">Log out</button>`;
    } else {
      avatar.innerHTML = "M";
      widget.innerHTML = `<div class="widget-title" style="font-size:18px; font-weight:800; margin-bottom:12px;">Join M today.</div><button class="dark-cta-btn" onclick="openAuthModal('signup')">Create account</button>`;
    }
  }

  function formatTime(dateString) {
    if (!dateString) return new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    const d = new Date(dateString);
    const today = new Date();
    if(d.toDateString() === today.toDateString()){
       return d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    } else {
       return d.toLocaleDateString([], {month: 'short', day: 'numeric'}) + ' ' + d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    }
  }

  async function loadFeed() {
    if (currentTab === 'notifications') return loadNotifications();
    if (currentTab === 'messages') return loadMessagesInbox();
    
    try {
      let { data: posts, error } = await sb.from('posts').select('*, likes(*), comments(*)').order('created_at', { ascending: false });
      if (!error) { allPosts = posts || []; renderFeed(allPosts); }
    } catch (err) {}
  }

  function startFeedAutoRefresh() {
    if(feedRefreshTimer) clearInterval(feedRefreshTimer);
    feedRefreshTimer = setInterval(async () => {
      if (currentTab !== 'foryou' && currentTab !== 'following') return;
      try {
        let { data: posts, error } = await sb.from('posts').select('*, likes(*), comments(*)').order('created_at', { ascending: false });
        if (!error && posts) {
          allPosts = posts;
          renderFeed(allPosts);
        }
      } catch(e){}
    }, 5000);
  }

  function generatePostsHtml(postsArr) {
    if (postsArr.length === 0) return `<div style="padding: 40px; text-align: center; color: var(--text-muted); font-size:18px;">No posts found!</div>`;
    return postsArr.map(p => {
      const isMine = currentUser && currentUser.id === p.user_id;
      const isLiked = currentUser && p.likes && p.likes.some(l => l.user_id === currentUser.id);
      const isBookmarked = bookmarks.includes(String(p.id));
      const isFollowing = following.includes(p.user_id);
      const commentsCount = p.comments ? p.comments.length : 0;
      const avatarLetter = (p.username||'?').charAt(0).toUpperCase();
      const postAvatarUrl = (currentUser && p.user_id === currentUser.id) ? (currentUser.user_metadata?.avatar_url || '') : '';
      const postTimeStr = formatTime(p.created_at);

      let contentText = p.content || ''; let finalContent = escapeHtml(contentText); let imgHtml = '';
      const mediaMatch = contentText.match(/https?:\/\/[^\s]+/i);
      if (mediaMatch && /\.(png|jpg|jpeg|gif|webp|mp4|webm|mov)(\?|$)/i.test(mediaMatch[0])) {
         const mediaUrl = mediaMatch[0];
         finalContent = finalContent.replace(mediaUrl, '').trim();
         if (/\.(mp4|webm|mov)(\?|$)/i.test(mediaUrl)) imgHtml = `<div class="post-image-box"><video src="${escapeHtml(mediaUrl)}" controls playsinline style="width:100%;display:block;"></video></div>`;
         else imgHtml = `<div class="post-image-box"><img src="${escapeHtml(mediaUrl)}" loading="lazy" alt="Post media"></div>`;
      }

      let commentsHtml = (p.comments || []).map(c => `
        <div class="comment-item">
          <div class="user-avatar" style="width:28px;height:28px;font-size:12px;border:none;">${(c.username||'?').charAt(0).toUpperCase()}</div>
          <div><strong style="color:var(--text-main);">@${c.username || 'user'}</strong> <span style="margin-left:4px;">${escapeHtml(c.content)}</span></div>
        </div>
      `).join('');

      return `
        <div class="post-card" id="post-${p.id}">
          <div class="user-avatar">${postAvatarUrl ? `<img src="${escapeHtml(postAvatarUrl)}" alt="Profile photo">` : escapeHtml(avatarLetter)}</div>
          <div class="post-body">
            <div class="post-author-row">
              <span class="author-name">${p.username || 'user'}</span> 
              <span class="author-handle">@${p.username || 'user'}</span>
              ${!isMine ? `<span style="color:var(--text-muted); margin:0 4px;">·</span> <button style="background:none; border:none; color:var(--x-blue); font-weight:700; font-size:14px; cursor:pointer;" onclick="toggleFollow('${p.user_id}', '${p.username}')">${isFollowing ? 'Following' : 'Follow'}</button>` : ''}
              <span class="post-time-badge">${postTimeStr}</span>
            </div>
            <div class="post-text">${finalContent}</div>
            ${imgHtml}
            <div class="post-interactions">
              <button class="action-icon-btn" onclick="toggleComments('comment-sec-${p.id}')">💬 <span>${commentsCount}</span></button>
              <button class="action-icon-btn" onclick="toggleRepost('${p.id}')">🔁 <span>${reposts.includes(String(p.id))?1:0}</span></button>
              <button class="action-icon-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike('${p.id}', ${isLiked}, '${p.user_id}')">${isLiked ? '❤️' : '🤍'} <span>${p.likes ? p.likes.length : 0}</span></button>
              <button class="action-icon-btn ${isBookmarked ? 'bookmarked' : ''}" onclick="toggleBookmark('${p.id}')">${isBookmarked ? '🔖' : '📑'}</button>
              ${isMine ? `<button class="action-icon-btn" style="color:#ef4444;" onclick="deletePost('${p.id}')">🗑️</button>` : ''}
            </div>
            <div class="comments-section" id="comment-sec-${p.id}">
              <div class="comment-input-box">
                <input type="text" id="reply-input-${p.id}" placeholder="Post your reply...">
                <button onclick="submitReply('${p.id}', '${p.user_id}')">Reply</button>
              </div>
              ${commentsHtml}
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  function renderFeed(postsArr) {
    let filtered = [...postsArr];
    if (currentTab === 'bookmarks') {
        filtered = filtered.filter(p => bookmarks.includes(String(p.id)));
    } else if (currentTab === 'following') {
        filtered = filtered.filter(p => following.includes(p.user_id));
        if (filtered.length === 0) {
            document.getElementById('feedContainer').innerHTML = `<div style="padding: 40px; text-align: center; color: var(--text-muted); font-size:18px;">You aren't following anyone yet!</div>`;
            return;
        }
    }
    document.getElementById('feedContainer').innerHTML = generatePostsHtml(filtered);
  }

  function toggleBookmark(postId) {
    if (!currentUser) return openAuthModal('login');
    postId = String(postId);
    if (bookmarks.includes(postId)) {
      bookmarks = bookmarks.filter(id => id !== postId);
      showToast('Bookmark removed');
    } else {
      bookmarks.push(postId);
      showToast('Post bookmarked 🔖');
    }
    localStorage.setItem('m_bookmarks', JSON.stringify(bookmarks));
    renderFeed(allPosts);
  }

  function toggleRepost(postId) {
    if (!currentUser) return openAuthModal('login');
    postId = String(postId);
    if (reposts.includes(postId)) {
      reposts = reposts.filter(id => id !== postId);
      showToast('Repost removed');
    } else {
      reposts.push(postId);
      showToast('Reposted 🔁');
    }
    localStorage.setItem('m_reposts', JSON.stringify(reposts));
    renderFeed(allPosts);
  }

  async function deletePost(postId) {
    if (!currentUser) return openAuthModal('login');
    const post = allPosts.find(p => String(p.id) === String(postId));
    if (!post || post.user_id !== currentUser.id) return showToast('You can only delete your own post.');
    if (!confirm('Are you sure you want to delete this post?')) return;
    const { data, error } = await sb.from('posts').delete()
      .eq('id', postId).eq('user_id', currentUser.id).select('id');
    if (error) { alert('Delete failed: ' + error.message); return; }
    if (!data || data.length === 0) { showToast('Post not deleted. Check Supabase DELETE policy.'); return; }
    allPosts = allPosts.filter(p => String(p.id) !== String(postId));
    bookmarks = bookmarks.filter(id => id !== String(postId));
    reposts = reposts.filter(id => id !== String(postId));
    localStorage.setItem('m_bookmarks', JSON.stringify(bookmarks));
    localStorage.setItem('m_reposts', JSON.stringify(reposts));
    renderFeed(allPosts);
    showToast('Post deleted 🗑️');
  }

  function toggleFollow(userId, username) {
    if (!currentUser) return openAuthModal();
    if (following.includes(userId)) { following = following.filter(id => id !== userId); showToast(`Unfollowed @${username}`); } 
    else { following.push(userId); showToast(`Following @${username} ✅`); }
    localStorage.setItem('m_following', JSON.stringify(following)); loadFeed();
  }

  async function toggleLike(postId, isLiked, postOwnerId) {
    if (!currentUser) return openAuthModal('login');
    try {
      let result;
      if (isLiked) result = await sb.from('likes').delete().match({ post_id: postId, user_id: currentUser.id });
      else result = await sb.from('likes').insert([{ post_id: postId, user_id: currentUser.id }]);
      if (result.error) { showToast('Like error: ' + result.error.message); return; }
      await loadFeed();
      if (!isLiked && currentUser.id !== postOwnerId) {
        const n = await sb.from('notifications').insert([{ user_id: postOwnerId, actor_username: (currentUser.user_metadata?.username || 'User'), type: 'like', post_id: postId }]);
        if (n.error) console.warn('Notification not saved:', n.error.message);
      }
    } catch(e) { showToast('Like failed: ' + (e.message || 'Please try again')); }
  }

  function toggleComments(id) { const sec = document.getElementById(id); sec.style.display = sec.style.display === 'block' ? 'none' : 'block'; }

  async function submitReply(postId, postOwnerId) {
    if (!currentUser) return openAuthModal();
    const input = document.getElementById(`reply-input-${postId}`); const text = input.value.trim(); if (!text) return;
    const username = currentUser.user_metadata?.username || currentUser.email.split('@')[0];
    try {
      const { error } = await sb.from('comments').insert([{ post_id: postId, user_id: currentUser.id, username, content: text }]);
      if (error) { showToast('Reply failed: ' + error.message); return; }
      if (currentUser.id !== postOwnerId) {
        const n = await sb.from('notifications').insert([{ user_id: postOwnerId, actor_username: username, type: 'reply', post_id: postId }]);
        if (n.error) console.warn('Notification not saved:', n.error.message);
      }
      input.value = ''; showToast('Reply added!'); loadFeed();
    } catch(e) { showToast('Reply failed: ' + (e.message || 'Please try again')); }
  }

  async function loadNotifications() {
    if (!currentUser) return openAuthModal();
    try {
      const { data, error } = await sb.from('notifications').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false });
      const feed = document.getElementById('feedContainer');
      if (!data || data.length === 0) return feed.innerHTML = `<div style="padding:40px;text-align:center;color:var(--text-muted);font-size:18px;">No notifications yet!</div>`;
      feed.innerHTML = data.map(n => `
        <div class="notif-item"><div style="font-size:28px;">${n.type === 'like' ? '❤️' : '💬'}</div><div><strong style="color:var(--text-main);">@${n.actor_username || 'User'}</strong> ${n.type === 'like' ? 'liked your post' : 'replied to your post'}</div></div>
      `).join('');
    } catch(e) {}
  }

  async function loadMessagesInbox() {
    if (!currentUser) return openAuthModal();
    try {
      const feed = document.getElementById('feedContainer');
      let uniqueUsers = []; let map = new Map();
      allPosts.forEach(p => { 
          if(p.user_id !== currentUser.id && !map.has(p.user_id)) { map.set(p.user_id, true); uniqueUsers.push({id: p.user_id, username: p.username}); }
      });
      if (uniqueUsers.length === 0) { feed.innerHTML = `<div style="padding:40px; text-align:center; color:var(--text-muted);">No other users found yet!</div>`; return; }

      feed.innerHTML = `
        <div style="padding: 16px 24px; font-weight: 800; border-bottom: 1px solid var(--border); color:var(--text-main); font-size:18px;">Start a Chat</div>
        <div>${uniqueUsers.map(u => `
            <div class="dm-user-item" onclick="openChatWith('${u.id}', '${u.username}')">
              <div class="user-avatar">${(u.username||'U').charAt(0).toUpperCase()}</div>
              <div><div style="font-weight:800; font-size:16px;">@${u.username || 'user'}</div><div style="font-size:14px; color:var(--text-muted);">Click here to send a message</div></div>
            </div>`).join('')}
        </div>
      `;
    } catch(e) {}
  }

  // --- V11: CHAT WITH DELETE MESSAGE FEATURE ---
  async function openChatWith(userId, username) {
    if (!currentUser) return openAuthModal();
    activeChatUser = { id: userId, username: username };
    currentMessageCount = 0;
    
    const feed = document.getElementById('feedContainer');
    document.getElementById('feedHeaderTitle').innerText = `Chat: @${username}`;

    feed.innerHTML = `
      <div class="chat-box-container">
        <div class="chat-messages" id="chatMessagesArea"><div style="text-align:center; color:var(--text-muted);">Loading...</div></div>
        <div class="chat-input-row">
          <input type="text" id="chatInputText" placeholder="Write a message..." onkeypress="if(event.key==='Enter') sendDirectMessage()">
          <button onclick="sendDirectMessage()">Send</button>
        </div>
      </div>
    `;

    await fetchAndRenderMessages(userId, true);
    if (chatPollTimer) clearTimeout(chatPollTimer);
    runBackupPoller(userId);

    if (realtimeChatSubscription) sb.removeChannel(realtimeChatSubscription);
    
    // Realtime connection for Insert and Delete events
    realtimeChatSubscription = sb.channel('public:messages')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, (payload) => {
        // If a message was deleted or inserted, re-fetch messages instantly
        if (activeChatUser) {
          fetchAndRenderMessages(activeChatUser.id, false);
        }
      })
      .subscribe();
  }

  async function runBackupPoller(userId) {
    if (!activeChatUser || activeChatUser.id !== userId) return;
    await fetchAndRenderMessages(userId, false);
    chatPollTimer = setTimeout(() => runBackupPoller(userId), 3000);
  }

  async function fetchAndRenderMessages(userId, forceScrollDown) {
    try {
      const { data: msgs, error } = await sb.from('messages')
        .select('*')
        .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${userId}),and(sender_id.eq.${userId},receiver_id.eq.${currentUser.id})`)
        .order('created_at', { ascending: true });

      if (error || !msgs) return;
      if (!forceScrollDown && msgs.length === currentMessageCount) return; 
      
      currentMessageCount = msgs.length;

      let chatHtml = msgs.map(m => {
        const isSent = m.sender_id === currentUser.id;
        const timeStr = formatTime(m.created_at);
        // Tap/Click bubble to delete your own message
        const clickAction = isSent ? `onclick="deleteMessage('${m.id}')"` : '';
        const titleTip = isSent ? `title="Tap to delete message"` : '';

        return `
          <div class="chat-bubble ${isSent ? 'sent' : 'received'}" ${clickAction} ${titleTip}>
            <div>${escapeHtml(m.message)}</div>
            <div class="chat-time">${timeStr}</div>
          </div>`;
      }).join('');

      const chatArea = document.getElementById('chatMessagesArea');
      if (chatArea) {
        chatArea.innerHTML = chatHtml || '<div style="text-align:center; color:var(--text-muted);">Say Hi! 👋 Tap your message to delete.</div>';
        if (forceScrollDown || msgs.length > currentMessageCount - 2) chatArea.scrollTop = chatArea.scrollHeight; 
      }
    } catch (e) {}
  }

  // DELETE MESSAGE FUNCTION
  async function deleteMessage(msgId) {
    if (!confirm("Delete this message?")) return;
    try {
      const { error } = await sb.from('messages').delete().eq('id', msgId);
      if (error) throw error;
      showToast("Message deleted 🗑️");
      if (activeChatUser) fetchAndRenderMessages(activeChatUser.id, false);
    } catch (e) {
      alert("Error deleting message: " + e.message);
    }
  }

  async function sendDirectMessage() {
    if (!currentUser || !activeChatUser) return;
    const input = document.getElementById('chatInputText');
    const text = input.value.trim(); if (!text) return; 
    input.value = ''; 
    
    await sb.from('messages').insert([{ sender_id: currentUser.id, receiver_id: activeChatUser.id, message: text }]);
    if (activeChatUser) fetchAndRenderMessages(activeChatUser.id, true);
  }

  async function handleFileUpload(event) {
    if (!currentUser) { event.target.value = ''; return openAuthModal('login'); }
    const file = event.target.files[0]; if (!file) return;
    if (file.size > 25 * 1024 * 1024) { showToast('Media must be under 25 MB.'); event.target.value = ''; return; }
    showToast('Uploading media... ⏳');
    const ext = (file.name.split('.').pop() || 'bin').replace(/[^a-z0-9]/gi, '');
    const filePath = `${currentUser.id}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
    const { error: upErr } = await sb.storage.from('media').upload(filePath, file);
    if (upErr) { alert('Upload failed: ' + upErr.message); return; }
    uploadedImageUrl = sb.storage.from('media').getPublicUrl(filePath).data.publicUrl;
    const isVideo = file.type.startsWith('video/');
    const img = document.getElementById('mediaPreviewImg');
    const video = document.getElementById('mediaPreviewVideo');
    img.style.display = isVideo ? 'none' : 'block';
    video.style.display = isVideo ? 'block' : 'none';
    if (isVideo) video.src = uploadedImageUrl; else img.src = uploadedImageUrl;
    document.getElementById('mediaPreviewContainer').style.display = 'block';
    showToast('Media ready! ✅');
  }

  async function handleAvatarUpload(event) {
    if (!currentUser) return openAuthModal('login');
    const file = event.target.files[0]; if (!file) return;
    if (!file.type.startsWith('image/')) { showToast('Please choose an image.'); return; }
    if (file.size > 5 * 1024 * 1024) { showToast('Profile photo must be under 5 MB.'); return; }
    showToast('Uploading profile photo...');
    const ext = (file.name.split('.').pop() || 'jpg').replace(/[^a-z0-9]/gi, '');
    const path = `${currentUser.id}/avatar-${Date.now()}.${ext}`;
    const { error: uploadError } = await sb.storage.from('media').upload(path, file);
    if (uploadError) { alert('Profile photo upload failed: ' + uploadError.message); return; }
    const url = sb.storage.from('media').getPublicUrl(path).data.publicUrl;
    const { data, error } = await sb.auth.updateUser({ data: { avatar_url: url } });
    if (error) { alert('Photo uploaded, but profile update failed: ' + error.message); return; }
    currentUser = data.user || currentUser;
    updateAuthUI();
    loadFeed();
    showToast('Profile photo updated! ✅');
    event.target.value = '';
  }

  function removeMedia() {
    uploadedImageUrl = '';
    document.getElementById('mediaUpload').value = '';
    document.getElementById('mediaPreviewContainer').style.display = 'none';
    document.getElementById('mediaPreviewImg').src = '';
    document.getElementById('mediaPreviewVideo').pause();
    document.getElementById('mediaPreviewVideo').src = '';
  }

  async function submitPost() {
    if (!currentUser) return openAuthModal('login');
    let content = document.getElementById('postInput').value.trim();
    if (uploadedImageUrl) content += (content ? '\n' : '') + uploadedImageUrl;
    if (!content) return showToast('Write something or add media first.');
    const username = currentUser.user_metadata?.username || currentUser.email.split('@')[0];
    const { error } = await sb.from('posts').insert([{ user_id: currentUser.id, username, content }]);
    if (error) { showToast('Post failed: ' + error.message); return; }
    document.getElementById('postInput').value = '';
    removeMedia();
    showToast('Posted successfully! 🚀');
    await loadFeed();
  }

  function switchTab(tab) {
    try {
      currentTab = tab;
      activeChatUser = null;
      if (chatPollTimer) clearTimeout(chatPollTimer);
      if (realtimeChatSubscription) { sb.removeChannel(realtimeChatSubscription); realtimeChatSubscription = null; }
      
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('mainTabs').querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('composerBox').style.display = 'none';
      document.getElementById('mainTabs').style.display = 'none';

      if (tab === 'foryou') {
        document.getElementById('composerBox').style.display = 'flex';
        document.getElementById('mainTabs').style.display = 'flex';
        document.getElementById('btnNavHome').classList.add('active');
        document.getElementById('tabForYou').classList.add('active');
        document.getElementById('feedHeaderTitle').innerText = 'Home';
        loadFeed();
      } else if (tab === 'following') {
        document.getElementById('composerBox').style.display = 'flex';
        document.getElementById('mainTabs').style.display = 'flex';
        document.getElementById('btnNavHome').classList.add('active');
        document.getElementById('tabFollowing').classList.add('active');
        document.getElementById('feedHeaderTitle').innerText = 'Home';
        loadFeed();
      } else if (tab === 'bookmarks') {
        document.getElementById('btnNavBookmarks').classList.add('active');
        document.getElementById('feedHeaderTitle').innerText = 'Bookmarks';
        loadFeed();
      } else if (tab === 'notifications') {
        document.getElementById('btnNavNotif').classList.add('active');
        document.getElementById('feedHeaderTitle').innerText = 'Notifications';
        loadNotifications();
      } else if (tab === 'messages') {
        document.getElementById('btnNavMessages').classList.add('active');
        document.getElementById('feedHeaderTitle').innerText = 'Messages';
        loadMessagesInbox();
      }
    } catch(e) {}
  }

  function handleSearch() { const q = document.getElementById('searchInput').value.toLowerCase(); document.getElementById('feedContainer').innerHTML = generatePostsHtml(allPosts.filter(p => (p.content||'').toLowerCase().includes(q) || (p.username||'').toLowerCase().includes(q))); }
  function escapeHtml(str) { return (str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m]); }

  let isSignUpMode = true;
  function openAuthModal(mode = 'login') { isSignUpMode = (mode === 'signup'); document.getElementById('authModal').style.display = 'flex'; }
  function toggleAuthMode() { isSignUpMode = !isSignUpMode; document.getElementById('authModalTitle').innerText = isSignUpMode ? "Create your Account" : "Log in to M"; }
  async function handleAuthSubmit() {
    const e = document.getElementById('authEmail').value.trim(), p = document.getElementById('authPassword').value.trim(), u = document.getElementById('authUsername').value.trim();
    if(!e || !p) return alert("Please enter email and password!");
    if (isSignUpMode && !/^[a-zA-Z0-9_.]{2,20}$/.test(u)) return alert("Username must be 2–20 characters (letters, numbers, _ or .).");
    let res = isSignUpMode ? await sb.auth.signUp({ email:e, password:p, options:{data:{username:u}} }) : await sb.auth.signInWithPassword({ email:e, password:p });
    if (res.error) alert(res.error.message);
    else {
      currentUser = res.data.user;
      if (res.data.session) {
        closeModal('authModal'); updateAuthUI(); showToast(isSignUpMode ? 'Account created! 🎉' : 'Login successful! 🎉'); loadFeed();
      } else { closeModal('authModal'); alert('Account created. Please confirm your email, then log in.'); }
    }
  }
  async function handleLogout() { await sb.auth.signOut(); currentUser = null; updateAuthUI(); showToast('Logged out 👋'); loadFeed(); }
  
  sb.auth.onAuthStateChange((_event, session) => {
    currentUser = session ? session.user : null;
    updateAuthUI();
  });
  window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
